<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - PlanSlot</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Pretendard, 'Malgun Gothic', Arial, sans-serif;
            background-color: #f8fafc; /* 일반 페이지 배경색 통일 */
            color: #0f172a;
        }

        .admin-layout {
            display: flex;
            width: 50%;
            margin: 24px auto;
            padding: 0 28px;
            gap: 40px;
            align-items: flex-start;
        }

        @media (max-width: 1280px) {
            .admin-layout {
                width: 100%;
            }
        }

        /* 사이드바 스타일 (마이페이지와 동일한 룩앤필) */
        .admin-sidebar {
            flex: 0 0 180px;
            background: #ffffff;
            border-radius: 20px;
            padding: 28px 0;
            box-shadow: 0 10px 40px rgba(8, 32, 51, 0.08);
        }

        .sidebar-title {
            font-size: 19px;
            font-weight: 700;
            color: #0f172a;
            padding: 0 28px;
            margin: 0 0 24px 0;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            padding: 14px 28px;
            color: #64748b;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .sidebar-menu li:hover a {
            background: #f8fafc;
            color: #0ea5e9;
        }

        .sidebar-menu li.active a {
            background: #f0f9ff;
            color: #0284c7;
            border-left: 3px solid #0ea5e9;
            font-weight: 600;
        }

        /* 메인 콘텐츠 영역 */
        .admin-content {
            flex: 1;
            min-width: 0;
        }

        .admin-container {
            width: 100%;
            box-sizing: border-box;
            padding: 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(8, 32, 51, 0.08);
        }

        .admin-header {
            text-align: left;
            margin-bottom: 32px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
        }

        .admin-header h1 {
            font-size: 28px;
            color: #0f172a;
            margin: 0 0 8px 0;
        }

        .admin-header p {
            color: #64748b;
            font-size: 15px;
            margin: 0;
        }

        .blank-state {
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
            font-size: 16px;
        }
    </style>
</head>
<body>

<!-- 공통 헤더 포함 -->
<div th:replace="~{global/header :: headerFragment}"></div>

<div class="admin-layout">
    <!-- 사이드바 (일반 페이지 스타일) -->
    <aside class="admin-sidebar">
        <h2 class="sidebar-title">관리자 메뉴</h2>
        <ul class="sidebar-menu">
            <li class="active"><a href="/admin">대시보드</a></li>
            <li><a href="#">회원 관리</a></li>
            <li><a href="#">게시판 관리</a></li>
            <li><a href="/admin/reports">신고 접수함</a></li>
        </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="admin-content">
        <div class="admin-container">
            <header class="admin-header">
                <h1>관리자 대시보드</h1>
                <p>관리자님, 환영합니다.</p>
            </header>

            <!-- 더미 데이터 제거, 빈 상태 표시 -->
            <div class="blank-state">
                아직 등록된 관리 데이터가 없습니다.<br>
                왼쪽 메뉴를 선택하여 관리를 시작하세요.
            </div>
        </div>
    </main>
</div>

</body>
</html>
