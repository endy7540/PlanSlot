<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - PlanSlot</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin_layout.css}">
    <link rel="stylesheet" href="/css/admin/dashboard.css">
</head>
<body>

<!-- 공통 헤더 포함 -->
<div th:replace="~{global/header :: headerFragment}"></div>

<!-- 모바일 어드민 메뉴 버튼 -->
<button type="button" class="admin-menu-toggle" id="adminMenuToggle" aria-label="관리자 메뉴 열기" aria-controls="adminSidebar" aria-expanded="false" style="display:none;">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <path d="M8 4v16"></path>
    </svg>
</button>
<div class="admin-sidebar-overlay" id="adminSidebarOverlay" aria-hidden="true"></div>

<div class="admin-layout">
    <!-- 공통 관리자 사이드바 포함 -->
    <div th:replace="~{admin/admin_sidebar :: adminSidebar('dashboard')}"></div>


    <!-- 메인 콘텐츠 -->
    <main class="admin-content">
        <div class="admin-container">
            <div class="admin-page-title">
                <h1>관리자 대시보드</h1>
                <p>관리자님, 환영합니다.</p>
            </div>

            <!-- 더미 데이터 제거, 빈 상태 표시 -->
            <div class="blank-state">
                아직 등록된 관리 데이터가 없습니다.<br>
                왼쪽 메뉴를 선택하여 관리를 시작하세요.
            </div>
        </div>
    </main>
</div>

</body>
</html>
