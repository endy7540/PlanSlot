<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 - PlanSlot Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin_layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin_tables.css}">
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<!-- 모바일 어드민 메뉴 버튼 -->
<button type="button" class="admin-menu-toggle" id="adminMenuToggle" aria-label="관리자 메뉴 열기" aria-controls="adminSidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <path d="M8 4v16"></path>
    </svg>
</button>
<div class="admin-sidebar-overlay" id="adminSidebarOverlay" aria-hidden="true"></div>

<div class="admin-layout">
    <div th:replace="~{admin/admin_sidebar :: adminSidebar('members')}"></div>

    <main class="admin-content">
        <div class="admin-container">
            <div class="admin-page-title">
                <div>
                    <h1>회원 관리</h1>
                </div>
            </div>

            <div class="board-toolbar">
                <div class="board-search">
                    <select id="memberSearchType" class="board-search-select">
                        <option value="ALL">전체</option>
                        <option value="NICKNAME">닉네임</option>
                        <option value="STATUS">상태</option>
                    </select>
                    <input type="text" id="memberSearchInput" placeholder="검색어를 입력하세요" onkeyup="if(event.key==='Enter') searchMembers()">
                    <button class="board-btn board-btn-sky" onclick="searchMembers()">검색</button>
                </div>
            </div>

            <div class="admin-member-count-wrapper">
                총 회원 수 <strong class="admin-member-count-number" id="totalCountSpan" th:text="${members.size()}">0</strong>명
            </div>

            <div class="table-responsive">
                <table class="admin-table" id="memberTable">
                <thead>
                    <tr>
                        <th class="no-wrap col-id">ID</th>
                        <th class="col-email">이메일</th>
                        <th class="col-nickname">닉네임</th>
                        <th class="no-wrap col-report-count">제재 횟수</th>
                        <th class="no-wrap col-date">가입일</th>
                        <th class="no-wrap col-action">상태 관리</th>
                        <th class="no-wrap col-suspend-date">제재 기간</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(members)}">
                        <td colspan="7" class="admin-table-empty">
                            회원이 없습니다.
                        </td>
                    </tr>
                    <tr th:each="member : ${members}" class="member-row">
                        <td class="no-wrap" th:text="${member.id}">1</td>
                        <td class="member-email" th:text="${member.email}">user@test.com</td>
                        <td class="member-nickname" th:text="${member.nickname}">홍길동</td>
                        <td class="text-center">
                            <span th:if="${member.reportedCount > 0}" class="report-count-positive" th:text="${member.reportedCount} + '회'">1회</span>
                            <span th:if="${member.reportedCount == 0}" class="report-count-zero">-</span>
                        </td>
                        <td class="no-wrap" th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}">2026-07-20</td>
                        
                        <td>
                            <div th:if="${member.status == 'WITHDRAWN'}">
                                <span class="badge-member-status badge-withdrawn">탈퇴 회원</span>
                            </div>
                            <div th:unless="${member.status == 'WITHDRAWN'}" class="member-action-wrapper">
                                <select class="select-status" th:id="'status_' + ${member.id}">
                                    <option value="ACTIVE" th:selected="${member.status == 'ACTIVE'}">정상</option>
                                    <option value="SUSPENDED" th:selected="${member.status == 'SUSPENDED'}">정지</option>
                                    <option value="BANNED" th:selected="${member.status == 'BANNED'}">영구정지</option>
                                </select>
                                <button type="button" class="btn-process" th:attr="onclick=|changeMemberStatus('${member.id}', 'status_${member.id}')|">변경</button>
                            </div>
                        </td>
                        <td>
                            <div th:if="${member.status == 'SUSPENDED' && member.suspendedUntil != null}" class="suspension-info">
                                <span th:text="${#temporals.format(member.suspendedUntil, 'yyyy-MM-dd HH:mm')}"></span> 까지
                            </div>
                            <span th:unless="${member.status == 'SUSPENDED' && member.suspendedUntil != null}" style="color: #94a3b8;">-</span>
                        </td>
                    </tr>
                </tbody>
                </table>
            </div>
            
            <!-- 페이지네이션 컨트롤 -->
            <div class="board-pagination" id="paginationContainer"></div>
        </div>
    </main>
</div>

<!-- Suspension Modal -->
<div class="modal-overlay" id="suspendModal" onclick="closeSuspendModal(event)">
    <div class="modal-content text-center" onclick="event.stopPropagation()">
        <div class="modal-header">
            <div class="modal-title">일시 정지 기간 설정</div>
            <button class="modal-close" onclick="closeSuspendModal(event)">&times;</button>
        </div>
        <div class="modal-body padded">
            <p class="suspend-modal-desc">해당 회원을 일시 정지할 기간을 선택하세요.</p>
            <div class="suspend-btn-group">
                <button type="button" class="suspend-btn" onclick="setSuspendDays(1)">1일</button>
                <button type="button" class="suspend-btn" onclick="setSuspendDays(3)">3일</button>
                <button type="button" class="suspend-btn" onclick="setSuspendDays(7)">7일</button>
                <button type="button" class="suspend-btn" onclick="setSuspendDays(15)">15일</button>
                <button type="button" class="suspend-btn" onclick="setSuspendDays(30)">30일</button>
            </div>
            <div class="suspend-custom-label-wrapper">
                <span class="suspend-custom-label">제재 기간 직접 입력</span>
            </div>
            <div class="suspend-custom-input-wrapper">
                <input type="number" id="customSuspendDays" placeholder="예: 5" class="board-search-select suspend-custom-input" min="1">
                <button type="button" class="btn-process suspend-custom-btn" onclick="confirmSuspend()">변경</button>
            </div>
        </div>
    </div>
</div>

<!-- Generic Confirm Modal -->
<div class="modal-overlay" id="confirmModal" onclick="closeConfirmModal(event)">
    <div class="modal-content text-center" onclick="event.stopPropagation()">
        <div class="modal-body padded">
            <p id="confirmModalMessage" class="modal-message"></p>
            <div class="modal-actions">
                <button type="button" class="board-btn modal-btn-cancel" onclick="closeConfirmModal(event, false)">취소</button>
                <button type="button" class="board-btn board-btn-sky modal-btn-confirm" onclick="closeConfirmModal(event, true)">확인</button>
            </div>
        </div>
    </div>
</div>

<!-- Generic Alert Modal -->
<div class="modal-overlay" id="alertModal" onclick="closeAlertModal(event)">
    <div class="modal-content text-center" onclick="event.stopPropagation()">
        <div class="modal-body padded">
            <p id="alertModalMessage" class="modal-message"></p>
            <div class="modal-actions">
                <button type="button" class="board-btn board-btn-sky modal-btn-confirm" onclick="closeAlertModal(event, true)">확인</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/admin/members.js"></script>
</body>

</html>
