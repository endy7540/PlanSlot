<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신고 접수함 - PlanSlot Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin_layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin_tables.css}">
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<div class="admin-layout">
    <div th:replace="~{admin/admin_sidebar :: adminSidebar('reports')}"></div>


    <main class="admin-content">
        <div class="admin-container">
            <div class="admin-page-title" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>신고 접수함</h1>
                </div>
            </div>

            <div class="board-toolbar">
                <div class="board-search">
                    <select id="reportSearchType" class="board-search-select">
                        <option value="ALL">전체</option>
                        <option value="TITLE">제목</option>
                        <option value="REASON">사유</option>
                        <option value="REPORTER">신고자</option>
                        <option value="REPORTED">피신고자</option>
                    </select>
                    <input type="text" id="reportSearchInput" placeholder="검색어를 입력하세요" onkeyup="if(event.key==='Enter') searchReports()">
                    <button class="board-btn board-btn-sky" onclick="searchReports()">검색</button>
                </div>
            </div>

            <div style="font-size: 13px; color: #64748b; margin-bottom: 12px; font-weight: bold;">
                총 접수 건 <strong style="color:#0ea5e9;" id="totalReportCountSpan" th:text="${reports.size()}">0</strong>건
            </div>

            <div style="overflow-x: auto; width: 100%;">
                <table class="admin-table" id="reportTable">
                <thead>
                    <tr>
                        <th class="no-wrap" style="width: 50px;">ID</th>
                        <th class="no-wrap" style="width: 60px;">유형</th>
                        <th style="width: 200px;">신고 대상 (제목)</th>
                        <th style="width: 150px;">신고 사유</th>
                        <th class="no-wrap" style="width: 80px;">신고자</th>
                        <th class="no-wrap" style="width: 80px;">피신고자</th>
                        <th class="no-wrap" style="width: 90px;">접수일</th>
                        <th class="no-wrap" style="width: 90px;">상태</th>
                        <th class="no-wrap" style="width: 80px;">관리</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(reports)}">
                        <td colspan="10" style="text-align: center; padding: 40px; color: #94a3b8;">
                            접수된 신고 내역이 없습니다.
                        </td>
                    </tr>
                    <tr th:each="report : ${reports}" class="report-row">
                        <td class="no-wrap" th:text="${report.reportId}">1</td>
                        <td class="no-wrap" th:text="${report.targetType == 'POST' ? '게시글' : (report.targetType == 'COMMENT' ? '댓글' : '채팅')}">게시글</td>
                        <td>
                            <div class="truncate truncate-target clickable-title report-target" 
                                 th:attr="onclick=|openModal('${report.targetType}', '${#strings.escapeJavaScript(report.targetContent)}', '${#strings.escapeJavaScript(report.targetBody != null ? report.targetBody : '')}', '${report.reasonCode}', '${#strings.escapeJavaScript(report.reasonDetail != null ? report.reasonDetail : '없음')}', '${report.reporterNickname}', '${report.reportedNickname}')|" 
                                 th:text="${report.targetContent}">글 제목이 표시됩니다...</div>
                        </td>
                        <td class="report-reason" th:text="${report.reasonCode}">스팸·광고</td>
                        <td class="no-wrap">
                            <div class="truncate truncate-reporter report-reporter" th:text="${report.reporterNickname}">홍길동</div>
                        </td>
                        <td class="no-wrap">
                            <div class="truncate truncate-reporter report-reported" th:text="${report.reportedNickname}" style="color: #ef4444; font-weight: 500;">작성자</div>
                        </td>
                        <td class="no-wrap" th:text="${#temporals.format(report.createdAt, 'yyyy-MM-dd')}">2026-07-17</td>
                        <td class="no-wrap">
                            <span th:class="'badge-status ' + (${report.status == 'WAITING'} ? 'badge-waiting' : (${report.status == 'APPROVED'} ? 'badge-processed' : 'badge-rejected'))"
                                  th:text="${report.status == 'WAITING' ? '대기중' : (report.status == 'APPROVED' ? '삭제 조치' : '기각됨')}">대기중</span>
                        </td>
                        <td class="no-wrap">
                            <div th:if="${report.status == 'WAITING'}" style="display:flex; flex-direction:column; gap: 6px; align-items:center; justify-content:center; width: 100%;">
                                <button type="button" class="btn-approve" th:attr="onclick=|processReport('${report.reportId}', 'approve')|" style="padding: 6px 0; width: 60px; font-size: 11px; box-sizing: border-box; text-align: center; display: block; margin: 0; line-height: 1;">삭제조치</button>
                                <button type="button" class="btn-reject" th:attr="onclick=|processReport('${report.reportId}', 'reject')|" style="padding: 6px 0; width: 60px; font-size: 11px; box-sizing: border-box; text-align: center; display: block; margin: 0; line-height: 1;">기각</button>
                            </div>
                            <span th:if="${report.status != 'WAITING'}" style="color:#94a3b8; font-size:13px;">처리됨</span>
                        </td>
                        <td></td>
                    </tr>
                </tbody>
                </table>
            </div>
            
            <!-- 페이지네이션 컨트롤 -->
            <div class="board-pagination" id="paginationContainer"></div>
        </div>
    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="reportModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <div class="modal-title">신고 상세 내용</div>
            <button class="modal-close" onclick="closeModal(event)">&times;</button>
        </div>
        <div class="modal-body">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">
                <div class="modal-body-item" style="margin: 0;">
                    <div class="modal-body-label">신고 사유</div>
                    <div id="modalReasonCode" style="color: #ef4444; font-weight: 600;"></div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px; text-align: right;">
                    <div class="modal-body-item" style="margin: 0;">
                        <div class="modal-body-label">피신고자</div>
                        <div id="modalReported" style="color: #ef4444; font-size: 13px; font-weight: 600;"></div>
                    </div>
                    <div class="modal-body-item" style="margin: 0;">
                        <div class="modal-body-label">신고자</div>
                        <div id="modalReporter" style="color: #64748b; font-size: 13px;"></div>
                    </div>
                </div>
            </div>
            
            <div class="modal-body-item">
                <div class="modal-body-label">상세 내용 (신고자 작성)</div>
                <div class="modal-body-content" id="modalReasonDetail" style="min-height: 40px;"></div>
            </div>
            <div class="modal-body-item">
                <div class="modal-body-label" id="modalTargetLabel">신고 대상</div>
                <div class="modal-body-content" style="min-height: 60px;">
                    <div style="margin-bottom: 4px;">
                        <span id="modalTitleBadge" style="font-size: 11px; background-color: #e2e8f0; color: #475569; padding: 3px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 8px; line-height: 1;">제목</span>
                        <div id="modalTargetContent" style="font-size: 13px; color: #475569; line-height: 1.5;"></div>
                    </div>
                    
                    <div id="modalTargetBodyContainer" style="display: none; border-top: 1px dashed #cbd5e1; padding-top: 12px; margin-top: 10px;">
                        <span style="font-size: 11px; background-color: #e2e8f0; color: #475569; padding: 3px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 8px; line-height: 1;">본문</span>
                        <div id="modalTargetBody" style="white-space: pre-wrap; font-size: 13px; color: #475569; line-height: 1.5;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
<script>
    let allRows = [];
    let filteredRows = [];
    let currentPage = 1;
    const itemsPerPage = 10;

    document.addEventListener("DOMContentLoaded", () => {
        const rows = document.querySelectorAll('.report-row');
        allRows = Array.from(rows);
        filteredRows = [...allRows];
        renderTable();
    });

    function searchReports() {
        const type = document.getElementById('reportSearchType').value;
        const input = document.getElementById('reportSearchInput').value.toLowerCase();
        
        filteredRows = allRows.filter(row => {
            const target = row.querySelector('.report-target').innerText.toLowerCase();
            const reason = row.querySelector('.report-reason').innerText.toLowerCase();
            const reporter = row.querySelector('.report-reporter').innerText.toLowerCase();
            const reported = row.querySelector('.report-reported').innerText.toLowerCase();
            
            if (type === 'ALL') {
                return target.includes(input) || reason.includes(input) || reporter.includes(input) || reported.includes(input);
            } else if (type === 'TITLE') {
                return target.includes(input);
            } else if (type === 'REASON') {
                return reason.includes(input);
            } else if (type === 'REPORTER') {
                return reporter.includes(input);
            } else if (type === 'REPORTED') {
                return reported.includes(input);
            }
            return true;
        });

        currentPage = 1;
        document.getElementById('totalReportCountSpan').innerText = filteredRows.length;
        renderTable();
    }

    function renderTable() {
        allRows.forEach(row => row.style.display = 'none');

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageRows = filteredRows.slice(startIndex, endIndex);
        
        pageRows.forEach(row => row.style.display = '');

        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredRows.length / itemsPerPage);
        const container = document.getElementById('paginationContainer');
        container.innerHTML = '';

        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = 'board-page-btn' + (i === currentPage ? ' active' : '');
            btn.innerText = i;
            btn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            container.appendChild(btn);
        }
    }

    function openModal(targetType, targetContent, targetBody, reasonCode, reasonDetail, reporterNickname, reportedNickname) {
        document.getElementById('modalReasonCode').innerText = reasonCode;
        document.getElementById('modalReporter').innerText = reporterNickname;
        document.getElementById('modalReported').innerText = reportedNickname;
        document.getElementById('modalReasonDetail').innerText = reasonDetail;
        
        let targetLabelText = '신고 대상';
        if (targetType === 'POST') targetLabelText = '신고 대상 게시물';
        else if (targetType === 'COMMENT') targetLabelText = '신고 대상 댓글';
        else if (targetType === 'CHAT') targetLabelText = '신고 대상 채팅방';
        
        document.getElementById('modalTargetLabel').innerText = targetLabelText;
        document.getElementById('modalTitleBadge').innerText = targetType === 'POST' ? '제목' : (targetType === 'CHAT' ? '방 이름' : '내용');
        document.getElementById('modalTargetContent').innerText = targetContent;
        
        if ((targetType === 'POST' || targetType === 'CHAT') && targetBody) {
            document.getElementById('modalTargetBodyContainer').style.display = 'block';
            document.getElementById('modalTargetBody').innerText = targetBody;
        } else {
            document.getElementById('modalTargetBodyContainer').style.display = 'none';
        }
        
        document.getElementById('reportModal').style.display = 'flex';
    }
    
    function closeModal(e) {
        if(e) e.preventDefault();
        document.getElementById('reportModal').style.display = 'none';
    }

    async function processReport(reportId, action) {
        if(!confirm(action === 'approve' ? '해당 대상을 정말로 [삭제 조치] 하시겠습니까?' : '이 신고를 [기각] 처리하시겠습니까? (대상은 유지됩니다)')) {
            return;
        }

        try {
            const response = await fetch(`/api/admin/reports/${reportId}/${action}`, {
                method: 'POST'
            });

            const result = await response.text();
            if (response.ok) {
                alert(result);
                window.location.reload();
            } else {
                alert('처리 실패: ' + result);
            }
        } catch (error) {
            alert('서버 통신에 실패했습니다.');
        }
    }
</script>
</html>
