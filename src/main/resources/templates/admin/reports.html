<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신고 접수함 - PlanSlot Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin_layout.css}">
    <style>
        /* 테이블 스타일 */
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        .report-table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .report-table td {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            vertical-align: middle;
        }

        .report-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .truncate {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        .truncate-target {
            max-width: 130px; /* 넓이를 더 줄임 */
        }

        .truncate-reporter {
            max-width: 70px;
        }

        .no-wrap {
            white-space: nowrap;
        }

        /* 상태 뱃지와 버튼 크기 통일 */
        .badge-status {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 76px;
            height: 32px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-waiting { background: #fef3c7; color: #d97706; }
        .badge-processed { background: #dcfce7; color: #16a34a; }
        .badge-rejected { background: #f1f5f9; color: #64748b; }

        .btn-process {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 76px;
            height: 32px;
            padding: 0;
            background-color: #0ea5e9;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-process:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<div class="admin-layout">
    <div th:replace="~{admin/admin_sidebar :: adminSidebar('reports')}"></div>


    <main class="admin-content">
        <div class="admin-container">
            <div class="admin-page-title" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>신고 접수함</h1>
                    <p>게시판 및 댓글에서 접수된 신고 내역을 확인하고 처리합니다.</p>
                </div>
                <div style="font-size: 14px; color: #64748b;">
                    총 접수 건: <strong style="color:#0ea5e9;" th:text="${reports.size()}">0</strong>건
                </div>
            </div>

            <table class="report-table">
                <thead>
                    <tr>
                        <th class="no-wrap" style="width: 50px;">ID</th>
                        <th class="no-wrap" style="width: 60px;">유형</th>
                        <th class="no-wrap" style="width: 150px;">신고 대상 (제목)</th>
                        <th class="no-wrap">신고 사유</th>
                        <th class="no-wrap" style="width: 90px;">신고자</th>
                        <th class="no-wrap" style="width: 90px;">접수일</th>
                        <th class="no-wrap" style="width: 90px;">상태</th>
                        <th class="no-wrap" style="width: 90px;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(reports)}">
                        <td colspan="8" style="text-align: center; padding: 40px; color: #94a3b8;">
                            접수된 신고 내역이 없습니다.
                        </td>
                    </tr>
                    <tr th:each="report : ${reports}">
                        <td class="no-wrap" th:text="${report.reportId}">1</td>
                        <td class="no-wrap" th:text="${report.targetType == 'POST' ? '게시글' : '댓글'}">게시글</td>
                        <td>
                            <div class="truncate truncate-target" th:text="${report.targetContent}">글 제목이 표시됩니다...</div>
                        </td>
                        <td class="no-wrap" th:text="${report.reasonCode}">스팸·광고</td>
                        <td class="no-wrap">
                            <div class="truncate truncate-reporter" th:text="${report.reporterNickname}">홍길동</div>
                        </td>
                        <td class="no-wrap" th:text="${#temporals.format(report.createdAt, 'yyyy-MM-dd')}">2026-07-17</td>
                        <td class="no-wrap">
                            <span th:class="'badge-status ' + (${report.status == 'WAITING'} ? 'badge-waiting' : (${report.status == 'PROCESSED'} ? 'badge-processed' : 'badge-rejected'))"
                                  th:text="${report.status == 'WAITING' ? '대기중' : (report.status == 'PROCESSED' ? '처리완료' : '반려')}">대기중</span>
                        </td>
                        <td class="no-wrap">
                            <button type="button" class="btn-process">상세확인</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

</body>
</html>
