<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신고 접수함 - PlanSlot Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin_layout.css}">
    <style>
        /* 테이블 스타일 */
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        .report-table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .report-table td {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            vertical-align: middle;
        }

        .report-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .truncate {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        .truncate-target {
            max-width: 130px; /* 넓이를 더 줄임 */
        }

        .truncate-reporter {
            max-width: 70px;
        }

        .no-wrap {
            white-space: nowrap;
        }

        /* 상태 뱃지와 버튼 크기 통일 */
        .badge-status {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 76px;
            height: 32px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-waiting { background: #fef3c7; color: #d97706; }
        .badge-processed { background: #dcfce7; color: #16a34a; }
        .badge-rejected { background: #f1f5f9; color: #64748b; }

        .btn-process {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 76px;
            height: 32px;
            padding: 0;
            background-color: #0ea5e9;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-process:hover {
            background-color: #0284c7;
        }
        .btn-reject {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 32px;
            padding: 0;
            background-color: #ef4444;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 4px;
        }
        .btn-reject:hover {
            background-color: #dc2626;
        }
        .btn-approve {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 32px;
            padding: 0;
            background-color: #10b981;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-approve:hover {
            background-color: #059669;
        }
        
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }
        .modal-body {
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
        }
        .modal-body-item {
            margin-bottom: 12px;
        }
        .modal-body-label {
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .modal-body-content {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            word-break: break-all;
        }
        
        .clickable-title {
            color: #0284c7;
            cursor: pointer;
            text-decoration: underline;
        }
        .clickable-title:hover {
            color: #0369a1;
        }
    </style>
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<div class="admin-layout">
    <div th:replace="~{admin/admin_sidebar :: adminSidebar('reports')}"></div>


    <main class="admin-content">
        <div class="admin-container">
            <div class="admin-page-title" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>신고 접수함</h1>
                    <p>게시판 및 댓글에서 접수된 신고 내역을 확인하고 처리합니다.</p>
                </div>
                <div style="font-size: 14px; color: #64748b;">
                    총 접수 건: <strong style="color:#0ea5e9;" th:text="${reports.size()}">0</strong>건
                </div>
            </div>

            <table class="report-table">
                <thead>
                    <tr>
                        <th class="no-wrap" style="width: 50px;">ID</th>
                        <th class="no-wrap" style="width: 60px;">유형</th>
                        <th class="no-wrap" style="width: 150px;">신고 대상 (제목)</th>
                        <th class="no-wrap">신고 사유</th>
                        <th class="no-wrap" style="width: 90px;">신고자</th>
                        <th class="no-wrap" style="width: 90px;">접수일</th>
                        <th class="no-wrap" style="width: 90px;">상태</th>
                        <th class="no-wrap" style="width: 120px;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(reports)}">
                        <td colspan="8" style="text-align: center; padding: 40px; color: #94a3b8;">
                            접수된 신고 내역이 없습니다.
                        </td>
                    </tr>
                    <tr th:each="report : ${reports}">
                        <td class="no-wrap" th:text="${report.reportId}">1</td>
                        <td class="no-wrap" th:text="${report.targetType == 'POST' ? '게시글' : '댓글'}">게시글</td>
                        <td>
                            <div class="truncate truncate-target clickable-title" 
                                 th:attr="onclick=|openModal('${report.targetType}', '${#strings.escapeJavaScript(report.targetContent)}', '${#strings.escapeJavaScript(report.targetBody != null ? report.targetBody : '')}', '${report.reasonCode}', '${#strings.escapeJavaScript(report.reasonDetail != null ? report.reasonDetail : '없음')}')|" 
                                 th:text="${report.targetContent}">글 제목이 표시됩니다...</div>
                        </td>
                        <td class="no-wrap" th:text="${report.reasonCode}">스팸·광고</td>
                        <td class="no-wrap">
                            <div class="truncate truncate-reporter" th:text="${report.reporterNickname}">홍길동</div>
                        </td>
                        <td class="no-wrap" th:text="${#temporals.format(report.createdAt, 'yyyy-MM-dd')}">2026-07-17</td>
                        <td class="no-wrap">
                            <span th:class="'badge-status ' + (${report.status == 'WAITING'} ? 'badge-waiting' : (${report.status == 'APPROVED'} ? 'badge-processed' : 'badge-rejected'))"
                                  th:text="${report.status == 'WAITING' ? '대기중' : (report.status == 'APPROVED' ? '삭제 조치' : '기각됨')}">대기중</span>
                        </td>
                        <td class="no-wrap">
                            <div th:if="${report.status == 'WAITING'}" style="display:flex; justify-content:center;">
                                <button type="button" class="btn-approve" th:attr="onclick=|processReport(${report.reportId}, 'approve')|" style="width: 70px;">삭제 조치</button>
                                <button type="button" class="btn-reject" th:attr="onclick=|processReport(${report.reportId}, 'reject')|" style="width: 70px;">기각</button>
                            </div>
                            <span th:if="${report.status != 'WAITING'}" style="color:#94a3b8; font-size:13px;">처리됨</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="reportModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <div class="modal-title">신고 상세 내용</div>
            <button class="modal-close" onclick="closeModal(event)">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-body-item">
                <div class="modal-body-label">신고 사유</div>
                <div class="modal-body-content" id="modalReasonCode"></div>
            </div>
            <div class="modal-body-item">
                <div class="modal-body-label">상세 내용 (신고자 작성)</div>
                <div class="modal-body-content" id="modalReasonDetail" style="min-height: 40px;"></div>
            </div>
            <div class="modal-body-item">
                <div class="modal-body-label" id="modalTargetLabel">신고 대상</div>
                <div class="modal-body-content" style="min-height: 60px;">
                    <div style="margin-bottom: 4px;">
                        <span id="modalTitleBadge" style="font-size: 11px; background-color: #e2e8f0; color: #475569; padding: 3px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 8px; line-height: 1;">제목</span>
                        <div id="modalTargetContent" style="font-size: 13px; color: #475569; line-height: 1.5;"></div>
                    </div>
                    
                    <div id="modalTargetBodyContainer" style="display: none; border-top: 1px dashed #cbd5e1; padding-top: 12px; margin-top: 10px;">
                        <span style="font-size: 11px; background-color: #e2e8f0; color: #475569; padding: 3px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 8px; line-height: 1;">본문</span>
                        <div id="modalTargetBody" style="white-space: pre-wrap; font-size: 13px; color: #475569; line-height: 1.5;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
<script>
    function openModal(targetType, targetContent, targetBody, reasonCode, reasonDetail) {
        document.getElementById('modalReasonCode').innerText = reasonCode;
        document.getElementById('modalReasonDetail').innerText = reasonDetail;
        
        document.getElementById('modalTargetLabel').innerText = targetType === 'POST' ? '신고 대상 게시물' : '신고 대상 댓글';
        document.getElementById('modalTitleBadge').innerText = targetType === 'POST' ? '제목' : '내용';
        document.getElementById('modalTargetContent').innerText = targetContent;
        
        if (targetType === 'POST' && targetBody) {
            document.getElementById('modalTargetBodyContainer').style.display = 'block';
            document.getElementById('modalTargetBody').innerText = targetBody;
        } else {
            document.getElementById('modalTargetBodyContainer').style.display = 'none';
        }
        
        document.getElementById('reportModal').style.display = 'flex';
    }
    
    function closeModal(e) {
        if(e) e.preventDefault();
        document.getElementById('reportModal').style.display = 'none';
    }

    async function processReport(reportId, action) {
        if(!confirm(action === 'approve' ? '해당 게시물을 정말로 [삭제 조치] 하시겠습니까?' : '이 신고를 [기각] 처리하시겠습니까? (대상 게시물은 유지됩니다)')) {
            return;
        }

        try {
            const response = await fetch(`/api/admin/reports/${reportId}/${action}`, {
                method: 'POST'
            });

            const result = await response.text();
            if (response.ok) {
                alert(result);
                window.location.reload();
            } else {
                alert('처리 실패: ' + result);
            }
        } catch (error) {
            alert('서버 통신에 실패했습니다.');
        }
    }
</script>
</html>
