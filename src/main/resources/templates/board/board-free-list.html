<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanSlot - 자유게시판</title>
  <link rel="stylesheet" th:href="@{/css/notification/notification.css}" href="/css/notification/notification.css">
  <link rel="stylesheet" th:href="@{/css/board/board.css}" href="/css/board/board.css">
</head>
<body data-board-page="list" data-board-type="FREE">

<div th:replace="~{global/header :: headerFragment}"></div>

<nav class="board-subnav" aria-label="게시판 메뉴">
  <div class="board-subnav-inner">
    <a data-board-nav="NOTICE" th:href="@{/board/notice}" href="/board/notice">공지사항</a>
    <a data-board-nav="STUDY" th:href="@{/board/study}" href="/board/study">스터디</a>
    <a data-board-nav="GROUP" th:href="@{/board/group}" href="/board/group">소모임</a>
    <a data-board-nav="FREE" th:href="@{/board/free}" href="/board/free">자유게시판</a>
  </div>
</nav>

<main class="board-main">
  <div class="board-page-head">
    <div>
      <div class="board-label">COMMUNITY</div>
      <h1>자유게시판</h1>
      <p>학교생활과 일상의 다양한 이야기를 자유롭게 나눠보세요.</p>
    </div>
    <div class="board-head-actions">
      <button class="board-btn board-btn-primary" id="boardRegisterButton" type="button" hidden>+ 글쓰기</button>
    </div>
  </div>

  <section>
    <div class="board-card board-toolbar">
      <div class="board-search">
        <select id="boardSearchType" class="board-search-select" aria-label="검색 조건">
          <option value="TITLE_CONTENT" selected>제목+내용</option>
          <option value="TITLE">제목</option>
          <option value="CONTENT">내용</option>
          <option value="WRITER">작성자</option>
        </select>

        <input id="boardSearchInput" type="search" maxlength="100" placeholder="검색어를 입력하세요">
        <button class="board-btn board-btn-sky" id="boardSearchButton" type="button">검색</button>
      </div>
      <div class="board-result-count" id="boardResultCount">총 0개</div>
    </div>

    <section class="board-card board-list-card">
      <div class="board-list-head">
        <div>구분</div><div>제목</div><div>작성자</div><div>조회</div><div>작성일</div>
      </div>
      <div id="boardList"><div class="board-loading">게시글을 불러오는 중...</div></div>
    </section>

    <nav class="board-pagination" id="boardPagination" aria-label="게시글 페이지"></nav>
  </section>
</main>

<div class="board-toast" id="boardToast"></div>
<script th:src="@{/js/board/board.js}" src="/js/board/board.js"></script>
</body>
</html>
