<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanSlot - 게시글 작성</title>
  <link rel="stylesheet" th:href="@{/css/notification/notification.css}" href="/css/notification/notification.css">
  <link rel="stylesheet" th:href="@{/css/board/board.css}" href="/css/board/board.css">
</head>
<body data-board-page="write" data-board-type="FREE">

<div th:replace="~{global/header :: headerFragment}"></div>

<nav class="board-subnav" aria-label="게시판 메뉴">
  <div class="board-subnav-inner">
    <a data-board-nav="NOTICE" th:href="@{/board/notice}" href="/board/notice">공지사항</a>
    <a data-board-nav="STUDY" th:href="@{/board/study}" href="/board/study">스터디</a>
    <a data-board-nav="CLUB" th:href="@{/board/club}" href="/board/club">소모임</a>
    <a data-board-nav="FREE" th:href="@{/board/free}" href="/board/free">자유게시판</a>
  </div>
</nav>

<main class="board-main">
  <section class="board-card board-auth-panel" id="boardLoginPanel" hidden>
    <h2>로그인이 필요합니다</h2>
    <p>게시글을 작성하거나 수정하려면 먼저 로그인해 주세요.</p>
    <a class="board-btn board-btn-primary" th:href="@{/auth/login}" href="/auth/login">로그인 페이지로 이동</a>
  </section>

  <div data-board-auth-content>
    <div class="board-breadcrumb">
      <a th:href="@{/home}" href="/home">홈</a><span>›</span>
      <a id="boardWriteListLink" href="/board/free">게시판</a><span>›</span>
      <span id="boardWriteCategory">게시판</span>
    </div>

    <div class="board-page-head">
      <div>
        <div class="board-label">COMMUNITY</div>
        <h1 id="boardWritePageTitle">새 게시글 작성</h1>
        <p>게시판 성격에 맞는 내용을 작성하고 필요한 경우 이미지를 한 장 첨부할 수 있어요.</p>
      </div>
    </div>

    <div class="board-card board-auth-panel" id="boardWriteLoading">작성 화면을 준비하는 중...</div>

    <section class="board-card board-form-card" id="boardWritePanel" hidden>
      <div class="board-notice-box">제목은 100자, 내용은 1000자까지 입력할 수 있습니다. 게시글 이미지는 한 장만 등록됩니다.</div>

      <form id="boardWriteForm">
        <div class="board-field">
          <label for="boardWriteTitle">제목 <span class="board-required">*</span></label>
          <input class="board-input" id="boardWriteTitle" type="text" maxlength="100" placeholder="제목을 입력해 주세요.">
          <div class="board-field-info"><span>게시판 이용자가 내용을 쉽게 알 수 있도록 작성해 주세요.</span><span id="boardWriteTitleCount">0 / 100</span></div>
        </div>

        <div class="board-field">
          <label for="boardWriteContent">내용 <span class="board-required">*</span></label>
          <textarea class="board-textarea" id="boardWriteContent" maxlength="1000" placeholder="내용을 입력해 주세요."></textarea>
          <div class="board-field-info"><span>개인정보가 포함되지 않도록 주의해 주세요.</span><span id="boardWriteContentCount">0 / 1000</span></div>
        </div>

        <div class="board-field">
          <label for="boardWriteImage">이미지</label>
          <div class="board-image-upload">
            <input id="boardWriteImage" type="file" accept="image/jpeg,image/png,image/webp">
            <div class="board-image-preview-wrap" id="boardWriteImagePreviewWrap">
              <img class="board-image-preview" id="boardWriteImagePreview" alt="첨부 이미지 미리보기">
              <div class="board-image-preview-actions">
                <button class="board-btn board-btn-danger board-btn-small" id="boardWriteImageRemove" type="button">이미지 제거</button>
              </div>
            </div>
          </div>
        </div>

        <div class="board-form-actions">
          <button class="board-btn board-btn-ghost" id="boardWriteCancel" type="button">취소</button>
          <button class="board-btn board-btn-primary" id="boardWriteSubmit" type="submit">등록하기</button>
        </div>
      </form>
    </section>
  </div>
</main>


<div class="board-toast" id="boardToast"></div>
<script th:src="@{/js/board/board.js}" src="/js/board/board.js"></script>
</body>
</html>
