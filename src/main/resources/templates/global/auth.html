<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanSlot - 로그인 및 회원가입</title>
    <link rel="stylesheet" href="/css/global/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="panel auth-page active" id="page-login">
        <div class="logo auth-style-1" title="메인 홈으로 이동" id="auth-extracted-js-1">PlanSlot</div>
        <div class="tagline">AI가 함께하는 일정 플랫폼</div>

        <div class="form">
            <input type="text" id="loginId" placeholder="아이디" inputmode="email" onkeydown="if(event.key==='Enter') document.getElementById('loginPw').focus()">
            <div  class="auth-style-2">
                <input type="password" id="loginPw" placeholder="비밀번호" onpaste="return false;" oncopy="return false;" onkeydown="if(event.key==='Enter') doLogin()"  class="auth-style-3">
                <button type="button" tabindex="-1"  class="auth-style-4" id="auth-extracted-js-2">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>
            <div id="loginPwMsg" class="field-msg"></div>
            <div id="loginPwCapsMsg" class="caps-msg">⚠️ Caps Lock이 켜져 있습니다.</div>
            
            <div  class="auth-style-5">
                <div  class="auth-style-6">
                    <a href="javascript:void(0);"  class="auth-style-7" id="auth-extracted-js-3">아이디 찾기</a>
                    <span  class="auth-style-8">|</span>
                    <a href="javascript:void(0);"  class="auth-style-9" id="auth-extracted-js-4">비밀번호 찾기</a>
                </div>
                <div  class="auth-style-10">
                    <input type="checkbox" id="keepLogin"  class="auth-style-11">
                    <label for="keepLogin"  class="auth-style-12">로그인 상태 유지</label>
                </div>
            </div>
            <button id="loginBtn" class="primary">로그인</button>
        </div>

        <div class="divider">또는</div>

        <div class="form">
            <button class="ghost auth-style-13" id="auth-extracted-js-5">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.766 12.2764C23.766 11.4607 23.6999 10.6406 23.5588 9.83807H12.24V14.4591H18.7217C18.4528 15.9494 17.5885 17.2678 16.323 18.1056V21.1039H20.19C22.4608 19.0139 23.766 15.9274 23.766 12.2764Z" fill="#4285F4"/>
                    <path d="M12.24 24.0008C15.4765 24.0008 18.2059 22.9382 20.1945 21.1039L16.3276 18.1055C15.2517 18.8375 13.8627 19.252 12.2445 19.252C9.11388 19.252 6.45946 17.1399 5.50705 14.3003H1.5166V17.3912C3.55371 21.4434 7.7029 24.0008 12.24 24.0008Z" fill="#34A853"/>
                    <path d="M5.50253 14.3003C5.00015 12.8099 5.00015 11.1961 5.50253 9.70575V6.61481H1.51649C-0.18551 10.0056 -0.18551 14.0004 1.51649 17.3912L5.50253 14.3003Z" fill="#FBBC04"/>
                    <path d="M12.24 4.74966C13.9509 4.7232 15.6042 5.36697 16.8434 6.54867L20.2695 3.12262C18.1001 1.0855 15.2208 -0.034466 12.24 0.000808666C7.7029 0.000808666 3.55371 2.55822 1.5166 6.61481L5.50264 9.70575C6.45064 6.86173 9.10947 4.74966 12.24 4.74966Z" fill="#EA4335"/>
                </svg>
                구글로 로그인
            </button>
            <button class="ghost auth-style-14" id="auth-extracted-js-6">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3C6.477 3 2 6.538 2 10.905c0 2.84 1.83 5.32 4.673 6.72-.15.545-.536 2-.6 2.27-.08.31.11.31.255.21.114-.08 1.83-1.22 2.58-1.74 1.01.28 2.06.43 3.092.43 5.523 0 10-3.537 10-7.904C22 6.538 17.523 3 12 3z" fill="#000000"/>
                </svg>
                카카오로 로그인
            </button>
            <button class="ghost" id="auth-extracted-js-7">회원가입</button>
        </div>
    </div>

    <div class="panel auth-page" id="page-signup">
        <div class="logo auth-style-15" >회원가입</div>
        <div class="tagline auth-style-16" >플랜슬롯과 함께 일정을 계획해보세요.</div>

        <div class="form">
            <button class="ghost auth-style-17" id="auth-extracted-js-8">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.766 12.2764C23.766 11.4607 23.6999 10.6406 23.5588 9.83807H12.24V14.4591H18.7217C18.4528 15.9494 17.5885 17.2678 16.323 18.1056V21.1039H20.19C22.4608 19.0139 23.766 15.9274 23.766 12.2764Z" fill="#4285F4"/>
                    <path d="M12.24 24.0008C15.4765 24.0008 18.2059 22.9382 20.1945 21.1039L16.3276 18.1055C15.2517 18.8375 13.8627 19.252 12.2445 19.252C9.11388 19.252 6.45946 17.1399 5.50705 14.3003H1.5166V17.3912C3.55371 21.4434 7.7029 24.0008 12.24 24.0008Z" fill="#34A853"/>
                    <path d="M5.50253 14.3003C5.00015 12.8099 5.00015 11.1961 5.50253 9.70575V6.61481H1.51649C-0.18551 10.0056 -0.18551 14.0004 1.51649 17.3912L5.50253 14.3003Z" fill="#FBBC04"/>
                    <path d="M12.24 4.74966C13.9509 4.7232 15.6042 5.36697 16.8434 6.54867L20.2695 3.12262C18.1001 1.0855 15.2208 -0.034466 12.24 0.000808666C7.7029 0.000808666 3.55371 2.55822 1.5166 6.61481L5.50264 9.70575C6.45064 6.86173 9.10947 4.74966 12.24 4.74966Z" fill="#EA4335"/>
                </svg>
                구글로 회원가입
            </button>
            <button class="ghost auth-style-18" id="auth-extracted-js-9">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3C6.477 3 2 6.538 2 10.905c0 2.84 1.83 5.32 4.673 6.72-.15.545-.536 2-.6 2.27-.08.31.11.31.255.21.114-.08 1.83-1.22 2.58-1.74 1.01.28 2.06.43 3.092.43 5.523 0 10-3.537 10-7.904C22 6.538 17.523 3 12 3z" fill="#000000"/>
                </svg>
                카카오로 회원가입
            </button>
        </div>

        <div class="divider">또는</div>

        <div class="form">
            <div  class="auth-style-19">
                <input type="text" id="signupId" placeholder="아이디 (필수)" inputmode="email"  class="auth-style-20">
                <button type="button" id="checkDuplicateBtn" class="ghost auth-style-21">중복 확인</button>
            </div>
            <div id="signupIdMsg" class="field-msg"></div>
            
            <div  class="auth-style-22">
                <input type="password" id="signupPw" placeholder="비밀번호 (필수)" onpaste="return false;" oncopy="return false;"  class="auth-style-23">
                <button type="button" tabindex="-1"  class="auth-style-24" id="auth-extracted-js-10">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>
            <div id="signupPwMsg" class="field-msg"></div>
            <div id="signupPwCapsMsg" class="caps-msg">⚠️ Caps Lock이 켜져 있습니다.</div>
            
            <div  class="auth-style-25">
                <input type="password" id="signupPwConfirm" placeholder="비밀번호 재확인 (필수)" onpaste="return false;" oncopy="return false;"  class="auth-style-26">
                <button type="button" tabindex="-1"  class="auth-style-27" id="auth-extracted-js-11">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>
            <div id="signupPwConfirmMsg" class="field-msg"></div>
            <div id="signupPwConfirmCapsMsg" class="caps-msg">⚠️ Caps Lock이 켜져 있습니다.</div>
            
            <div  class="auth-style-28">
                <input type="email" id="signupEmail" placeholder="이메일 (필수)"  class="auth-style-29">
                <button type="button" class="ghost auth-style-30" id="sendEmailBtn">인증번호 발송</button>
            </div>
            <div id="signupEmailMsg" class="field-msg"></div>
            
            <div id="authCodeContainer"  class="auth-style-31">
                <div  class="auth-style-32">
                    <input type="text" id="signupAuthCode" placeholder="인증번호 6자리"  class="auth-style-33">
                    <span id="authTimer"  class="auth-style-34">05:00</span>
                </div>
                <button type="button" id="verifyEmailBtn" class="primary auth-style-35">인증 확인</button>
            </div>
            <div id="signupAuthCodeMsg" class="field-msg"></div>
            
            <input type="text" id="signupNickname" placeholder="닉네임 (2~20자)" maxlength="20">
            <div id="signupNicknameMsg" class="field-msg"></div>
            <div  class="auth-style-36">
                <select id="signupSido"  class="auth-style-37">
                    <option value="">시/도 선택</option>
                </select>
                <select id="signupSigungu"  class="auth-style-38">
                    <option value="">시/군/구 선택</option>
                </select>
            </div>


            <div class="btn-row auth-style-39" >
                <button id="signupBtn" class="primary auth-style-40">회원가입 완료</button>
                <button class="ghost" id="auth-extracted-js-12">로그인 화면으로 이동</button>
            </div>
        </div>
    </div>

    <div class="panel auth-page" id="page-find-id">
        <div class="logo auth-style-41" >아이디 찾기</div>
        <div class="tagline auth-style-42" >가입 시 사용한 이메일로 아이디를 찾습니다.</div>
        <div class="form">
            <div  class="auth-style-43">
                <input type="email" id="findIdEmail" placeholder="이메일 입력"  class="auth-style-44">
                <button type="button" class="ghost auth-style-45" id="findIdSendBtn">인증 발송</button>
            </div>
            <div id="findIdEmailMsg" class="field-msg"></div>
            
            <div id="findIdAuthCodeContainer"  class="auth-style-46">
                <div  class="auth-style-47">
                    <input type="text" id="findIdAuthCode" placeholder="인증번호 6자리"  class="auth-style-48">
                    <span id="findIdAuthTimer"  class="auth-style-49">05:00</span>
                </div>
                <button type="button" class="ghost auth-style-50" id="auth-extracted-js-13">인증 확인</button>
            </div>
            <div id="findIdAuthCodeMsg" class="field-msg"></div>
            <button class="ghost auth-style-51" id="auth-extracted-js-14">로그인 화면으로 돌아가기</button>
        </div>
    </div>

    <div class="panel auth-page" id="page-find-pw">
        <div class="logo auth-style-52" >비밀번호 찾기</div>
        <div class="tagline auth-style-53" >아이디와 이메일 인증으로 임시 비밀번호를 발급받습니다.</div>
        <div class="form">
            <input type="text" id="findPwId" placeholder="아이디 입력"  class="auth-style-54">
            <div  class="auth-style-55">
                <input type="email" id="findPwEmail" placeholder="이메일 입력"  class="auth-style-56">
                <button type="button" class="ghost auth-style-57" id="findPwSendBtn">인증 발송</button>
            </div>
            <div id="findPwEmailMsg" class="field-msg"></div>
            
            <div id="findPwAuthCodeContainer"  class="auth-style-58">
                <div  class="auth-style-59">
                    <input type="text" id="findPwAuthCode" placeholder="인증번호 6자리"  class="auth-style-60">
                    <span id="findPwAuthTimer"  class="auth-style-61">05:00</span>
                </div>
                <button type="button" class="ghost auth-style-62" id="auth-extracted-js-15">인증 확인</button>
            </div>
            <div id="findPwAuthCodeMsg" class="field-msg"></div>
            <button class="ghost auth-style-63" id="auth-extracted-js-16">로그인 화면으로 돌아가기</button>
        </div>
    </div>

</div>

<script src="/js/global/region.js"></script>
<script src="/js/global/auth.js"></script>

</body>
</html>
