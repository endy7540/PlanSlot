<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<div th:fragment="headerFragment">
  <style>
    .header-nav{
      height:78px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
      padding:0 28px;background:#F3FAFF;border-bottom:2px solid #DCEFFC;
      box-shadow:0 6px 18px rgba(8,32,51,.05);
    }
    .header-brand{cursor:pointer;}
    .header-brand .logo{font-size:28px;font-weight:950;color:#38BDF8!important}
    .header-brand .tagline{margin-top:4px;font-size:11px;color:#748898!important}
    .header-menu {display:flex;gap:30px;font-weight:bold;align-items:center;margin:0 auto;}
    .header-menu a {text-decoration:none;color:#075985;font-size:17px;transition:color 0.2s;}
    .header-menu a:hover {color:#38BDF8;}
    .header-actions{display:flex;align-items:center;gap:10px}
    .btn-logout{
      padding:8px 16px;border:2px solid #DCEFFC;background:#fff;border-radius:8px;
      font-weight:bold;color:#075985;transition:.2s;
    }
    .btn-logout:hover{background:#E0F2FE}
    .notification-bell svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
  </style>

  <header class="header-nav">
    <div class="header-brand" onclick="location.href='/'">
      <div class="logo">PlanSlot</div>
      <div class="tagline">
        AI가 함께하는 일정 플랫폼
      </div>
    </div>

    <!-- 4가지 카테고리 -->
    <nav class="header-menu">
      <a th:href="@{/schedule}">개인 캘린더</a>
      <a th:href="@{/group}">모임 캘린더</a>
      <a th:href="@{/board}">모임 게시판</a>
      <a th:href="@{/groupChat}">모임 채팅방</a>
    </nav>

    <div class="header-actions">
      <div class="notification-wrap">
        <button class="notification-bell" id="notificationBell" type="button" aria-label="알림 열기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
          </svg>
          <span class="notification-badge" id="notificationBadge">0</span>
        </button>

        <div class="notification-dropdown" id="notificationDropdown">
          <div class="notification-dropdown-head">
            <div>
              <b>알림</b>
              <span id="dropdownUnreadText">읽지 않은 알림 0개</span>
            </div>
            <button class="notification-text-button" id="dropdownReadAll" type="button">전체 읽음</button>
          </div>

          <div class="notification-dropdown-list" id="notificationDropdownList">
            <div class="notification-loading">알림을 불러오는 중...</div>
          </div>

          <a class="notification-view-all" th:href="@{/notification/list}" href="/notification/list">
            알림 전체 보기 →
          </a>
        </div>
      </div>

      <button id="authBtn" class="btn-logout">로딩중...</button>
    </div>
  </header>
</div>
</body>
</html>
