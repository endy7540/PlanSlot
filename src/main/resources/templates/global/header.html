<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="headerFragment">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" th:href="@{/css/notification/notification.css}">
  <link rel="stylesheet" th:href="@{/css/global/header.css}">

  <header class="header-nav">
    <a class="header-brand" th:href="@{/planslot}" href="/planslot">
      <div class="logo">PlanSlot</div>
      <div class="tagline">AI가 함께하는 일정 플랫폼</div>
    </a>

    <button class="header-menu-toggle" id="headerMenuToggle" type="button" aria-label="전체 메뉴 열기" aria-controls="headerMenu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- 4가지 카테고리 -->
    <nav class="header-menu" id="headerMenu">
      <a th:href="@{/schedule}">개인 캘린더</a>
      <a th:href="@{/group}">모임 캘린더</a>
      <a th:href="@{/groupChat}">모임 채팅방</a>
      <a th:href="@{/board}">모임 게시판</a>
    </nav>

    <div class="header-actions">
      <div class="profile-dropdown-wrap" id="profileWrap">
        <button class="profile-btn" id="profileBtn" type="button" aria-label="프로필 메뉴">
          <span class="profile-nickname" id="headerNickname">로딩중...</span>
          <img src="/images/default-avatar.png" alt="" class="profile-img" id="headerProfileImage">
        </button>
        <div class="profile-dropdown" id="profileDropdown">
          <a id="adminPageLink" th:href="@{/admin/reports}">관리자 페이지</a>
          <a th:href="@{/mypage}">마이페이지</a>
          <button id="logoutBtn" type="button">로그아웃</button>
        </div>
      </div>
      <button id="loginBtn" class="btn-logout" type="button">로그인</button>

      <div class="notification-wrap">
        <button class="notification-bell" id="notificationBell" type="button" aria-label="알림 열기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
          </svg>
          <span class="notification-badge" id="notificationBadge">0</span>
        </button>

        <div class="notification-dropdown" id="notificationDropdown">
          <div class="notification-dropdown-head">
            <div>
              <b>알림</b>
              <span id="dropdownUnreadText">읽지 않은 알림 0개</span>
            </div>
            <button class="notification-text-button" id="dropdownReadAll" type="button">전체 읽음</button>
          </div>

          <div class="notification-dropdown-list" id="notificationDropdownList">
            <div class="notification-loading">알림을 불러오는 중...</div>
          </div>

          <a class="notification-view-all" th:href="@{/notification/list}" href="/notification/list">
            알림 전체 보기 →
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- [공통 백그라운드 AI 분석 진행용 플로팅 위젯 컨테이너] -->
  <div id="aiWidgetContainer" class="ai-widget-container">
    <!-- [공통 백그라운드 AI 분석 진행용 플로팅 위젯 (이미지 일정)] -->
    <div id="aiFloatingWidget" class="ai-floating-widget ai-floating-widget-image">
      <div class="ai-widget-row">
        <div id="aiWidgetIcon" class="ai-widget-icon">🔮</div>
        <div class="ai-widget-content">
          <div class="ai-widget-header">
            <span id="aiWidgetTitle" class="ai-widget-title">AI 이미지 일정 분석 중</span>
            <button id="aiWidgetCloseBtn" class="ai-widget-close" type="button" aria-label="AI 이미지 일정 위젯 닫기">×</button>
          </div>
          <p id="aiWidgetDesc" class="ai-widget-description">이미지 파일을 서버로 업로드하여 분석 요청을 보내는 중입니다...</p>
          <div id="aiWidgetLoadingBar" class="ai-widget-loading-bar">
            <div id="aiWidgetProgressBar" class="ai-widget-progress-bar ai-widget-progress-image"></div>
          </div>
          <div id="aiWidgetActionContainer" class="ai-widget-action-container">
            <button id="aiWidgetActionBtn" class="ai-widget-action-button ai-widget-action-image" type="button">📋 분석 결과 확인</button>
          </div>
        </div>
      </div>
    </div>

    <!-- [공통 백그라운드 AI 분석 진행용 플로팅 위젯 (채팅 요약)] -->
    <div id="chatAiFloatingWidget" class="ai-floating-widget ai-floating-widget-chat">
      <div class="ai-widget-row">
        <div id="chatAiWidgetIcon" class="ai-widget-icon">✨</div>
        <div class="ai-widget-content">
          <div class="ai-widget-header">
            <span id="chatAiWidgetTitle" class="ai-widget-title">AI 채팅 요약 분석 중</span>
            <button id="chatAiWidgetCloseBtn" class="ai-widget-close" type="button" aria-label="AI 채팅 요약 위젯 닫기">×</button>
          </div>
          <p id="chatAiWidgetDesc" class="ai-widget-description">대화 내용을 요약하고 일정을 찾는 중입니다...</p>
          <div id="chatAiWidgetLoadingBar" class="ai-widget-loading-bar">
            <div id="chatAiWidgetProgressBar" class="ai-widget-progress-bar ai-widget-progress-chat"></div>
          </div>
          <div id="chatAiWidgetActionContainer" class="ai-widget-action-container">
            <button id="chatAiWidgetActionBtn" class="ai-widget-action-button ai-widget-action-chat" type="button">📋 분석 결과 확인</button>
          </div>
        </div>
      </div>
    </div>

    <!-- [공통 백그라운드 AI 분석 진행용 플로팅 위젯 (모임 일정 추천)] -->
    <div id="groupAiFloatingWidget" class="ai-floating-widget ai-floating-widget-group">
      <div class="ai-widget-row">
        <div id="groupAiWidgetIcon" class="ai-widget-icon">🗓️</div>
        <div class="ai-widget-content">
          <div class="ai-widget-header">
            <span id="groupAiWidgetTitle" class="ai-widget-title">AI 시간 추천 분석 중</span>
            <button id="groupAiWidgetCloseBtn" class="ai-widget-close" type="button" aria-label="AI 시간 추천 위젯 닫기">×</button>
          </div>
          <p id="groupAiWidgetDesc" class="ai-widget-description">모임원들의 일정을 분석해서 추천 시간을 찾는 중입니다...</p>
          <div id="groupAiWidgetLoadingBar" class="ai-widget-loading-bar">
            <div id="groupAiWidgetProgressBar" class="ai-widget-progress-bar ai-widget-progress-group"></div>
          </div>
          <div id="groupAiWidgetActionContainer" class="ai-widget-action-container">
            <button id="groupAiWidgetActionBtn" class="ai-widget-action-button ai-widget-action-group" type="button">📋 분석 결과 확인</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/js/global/header.js}"></script>
  <script th:src="@{/js/notification/notification.js}"></script>
</div>
</body>
</html>
