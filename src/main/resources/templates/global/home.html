<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanSlot - 홈</title>

  <link rel="stylesheet" th:href="@{/css/global/home.css}">
  <link rel="stylesheet" th:href="@{/css/chatbot/chatbot.css}">
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<main class="main">
  <div class="hero-row">
    <div class="hero-card">
      <div style="color:#8B5CF6;font-weight:900;font-size:12px;">PLAN YOUR TIME</div>
      <h1>환영합니다!</h1>
      <p>개인 일정과 모임 일정을 한 곳에서 관리하고, AI가 더 나은 시간을 추천해줘요.</p>
      <button class="primary" onclick="testApiCall()">내 정보 불러오기 테스트</button>
    </div>

    <div class="stat-card" style="border-left:10px solid #A78BFA;">
      <b>0</b>
      <span>이번 주 일정</span>
    </div>

    <div class="stat-card" style="border-left:10px solid #38BDF8;">
      <b>0</b>
      <span>참여 중인 모임</span>
    </div>

    <div class="stat-card" style="border-left:10px solid #7DD3FC;">
      <b id="homeUnreadCount">0</b>
      <span>새 알림</span>
    </div>
  </div>
</main>

<div class="notification-toast" id="notificationToast"></div>

<div class="chatbot-shell" id="chatbotShell" hidden>
  <button class="chatbot-toggle" id="chatbotToggle" type="button" aria-label="플랜슬롯 AI 챗봇 열기" aria-expanded="false">
    <span class="chatbot-toggle-emoji" aria-hidden="true">🤖</span>
    <span class="chatbot-toggle-text">
        <strong>AI 챗봇</strong>
        <small>PlanSlot 사용법 안내</small>
    </span>
  </button>

  <section class="chatbot-window" id="chatbotWindow" aria-label="플랜슬롯 AI 도우미" hidden>
    <div class="chatbot-header">
      <div class="chatbot-header-title">
        <div class="chatbot-header-badge">PS</div>
        <div class="chatbot-header-text">
          <strong>플랜슬롯 AI 도우미</strong>
          <span>서비스 이용 방법 안내</span>
        </div>
      </div>
      <div class="chatbot-header-actions">
        <button class="chatbot-clear-btn" id="chatbotClear" type="button">기록 지우기</button>
        <button class="chatbot-icon-btn" id="chatbotClose" type="button" aria-label="챗봇 닫기">×</button>
      </div>
    </div>

    <div class="chatbot-messages" id="chatbotMessages" role="log" aria-live="polite"></div>

    <div class="chatbot-compose">
      <div class="chatbot-input-wrap">
        <textarea class="chatbot-input" id="chatbotInput" maxlength="100" rows="1" placeholder="플랜슬롯 사용 방법을 질문해 주세요."></textarea>
        <button class="chatbot-send-btn" id="chatbotSend" type="button" disabled>전송</button>
      </div>
    </div>
  </section>
</div>

<script th:src="@{/js/global/home.js}"></script>
<script th:src="@{/js/chatbot/chatbot.js}"></script>


</body>
</html>
