<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약관 동의 - 널모아</title>
    <link rel="stylesheet" href="/css/global/reset.css">
    <link rel="stylesheet" href="/css/global/common.css">
    <style>
        body {
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .terms-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            padding: 40px;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #182B3A;
            margin-bottom: 24px;
            text-align: center;
        }
        .terms-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }
        .terms-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #334155;
            cursor: pointer;
        }
        .terms-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .terms-item.required {
            font-weight: bold;
            color: #182B3A;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #0077FF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #005fcc;
        }
        .error-msg {
            color: #B91C1C;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="terms-container">
    <h2 class="title">약관 동의 및 알림 설정</h2>
    
    <div class="terms-box">
        <label class="terms-item" style="font-weight: 700; color: #0077FF; margin-bottom: 8px;">
            <input type="checkbox" id="agreeAll">
            전체 동의하기
        </label>
        <hr style="border:0; border-top:2px solid #e2e8f0; margin:0 0 8px 0;">

        <label class="terms-item required">
            <input type="checkbox" id="agreeSystemNoti" class="term-checkbox">
            [필수] 시스템 및 보안 중요 알림 수신 동의
        </label>
        <hr style="border:0; border-top:1px solid #e2e8f0; margin:4px 0;">
        <label class="terms-item">
            <input type="checkbox" id="allowActivityNoti" class="term-checkbox">
            [선택] 모임 및 일정 활동 알림 수신 동의
        </label>
        <label class="terms-item">
            <input type="checkbox" id="allowMarketingNoti" class="term-checkbox">
            [선택] 혜택 및 이벤트 알림 수신 동의
        </label>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <button class="btn-submit" onclick="submitTerms()">가입 완료하기</button>
</div>

<script>
    const API_BASE = "http://localhost:8080";

    const agreeAllCheckbox = document.getElementById('agreeAll');
    const termCheckboxes = document.querySelectorAll('.term-checkbox');

    // 전체 동의 클릭 시 개별 체크박스 토글
    agreeAllCheckbox.addEventListener('change', (e) => {
        termCheckboxes.forEach(cb => cb.checked = e.target.checked);
    });

    // 개별 체크박스 클릭 시 전체 동의 상태 업데이트
    termCheckboxes.forEach(cb => {
        cb.addEventListener('change', () => {
            const allChecked = Array.from(termCheckboxes).every(c => c.checked);
            agreeAllCheckbox.checked = allChecked;
        });
    });

    async function submitTerms() {
        const agreeSystemNoti = document.getElementById('agreeSystemNoti').checked;
        const allowActivityNoti = document.getElementById('allowActivityNoti').checked;
        const allowMarketingNoti = document.getElementById('allowMarketingNoti').checked;
        const errorMsg = document.getElementById('errorMsg');

        if (!agreeSystemNoti) {
            errorMsg.innerText = '[필수] 시스템 및 보안 중요 알림 수신에 동의해주세요.';
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isSocial = urlParams.get('social') === 'true';

        errorMsg.style.color = "#334155";
        errorMsg.innerText = "처리 중...";

        if (isSocial) {
            // 소셜 회원가입의 경우 이미 계정은 생성되어 로그인 상태임 (토큰 발급됨)
            // JWT 토큰을 localStorage 또는 cookie에서 가져와서 PUT /members/notifications 요청
            const token = localStorage.getItem('jwtToken') || getCookie('jwtToken');
            
            try {
                const response = await fetch(`${API_BASE}/members/notifications`, {
                    method: "PUT",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        allowActivityNoti: allowActivityNoti,
                        allowMarketingNoti: allowMarketingNoti
                    })
                });

                if (response.ok) {
                    window.location.href = '/planslot'; // 홈으로 이동
                } else {
                    throw new Error();
                }
            } catch(e) {
                errorMsg.style.color = "#B91C1C";
                errorMsg.innerText = "설정 저장에 실패했습니다. 홈으로 이동합니다.";
                setTimeout(() => window.location.href = '/planslot', 1500);
            }
        } else {
            // 일반 회원가입의 경우 sessionStorage에서 기존에 입력한 정보 가져와서 POST /auth/signup 요청
            const signupDataStr = sessionStorage.getItem('signupData');
            if (!signupDataStr) {
                alert('잘못된 접근입니다.');
                window.location.href = '/auth/login';
                return;
            }
            const signupData = JSON.parse(signupDataStr);
            signupData.allowActivityNoti = allowActivityNoti;
            signupData.allowMarketingNoti = allowMarketingNoti;

            try {
                const response = await fetch(`${API_BASE}/auth/signup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(signupData)
                });
                
                const result = await response.text();
                
                if(response.ok) {
                    sessionStorage.removeItem('signupData');
                    alert("회원가입이 완료되었습니다! 로그인해주세요.");
                    window.location.href = '/auth/login';
                } else {
                    alert('회원가입에 실패했습니다.');
                    window.location.href = '/auth/login';
                }
            } catch (error) {
                errorMsg.style.color = "#B91C1C";
                errorMsg.innerText = '서버 통신에 실패했습니다.';
            }
        }
    }

    // 쿠키 가져오는 유틸
    function getCookie(name) {
        let matches = document.cookie.match(new RegExp(
            "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
        ));
        return matches ? decodeURIComponent(matches[1]) : undefined;
    }
</script>
</body>
</html>
