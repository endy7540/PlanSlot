<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanSlot - AI 시간 추천</title>
<link rel="stylesheet" th:href="@{/css/group/group-shared.css}">
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<div class="app">
  <div class="breadcrumb"><a th:href="@{/group/list}" href="group-list.html">내 모임</a> <span id="crumbSep"> / </span> <a id="crumbGroup" href="#">모임</a></div>

  <div class="page-head">
    <div>
      <div class="brand"><b>PlanSlot</b> · AI 시간 추천</div>
      <h1 id="groupTitle">AI 시간 추천</h1>
      <p>모임원이 공유한 일정을 바탕으로 다 같이 가능한 시간을 찾아드려요.</p>
    </div>
    <div class="head-actions">
      <a class="btn btn-ghost" id="btnBack" href="#">← 모임으로 돌아가기</a>
    </div>
  </div>

  <div class="ai-layout">
    <section class="card ai-card">
      <h2>공통 가능 시간 분석</h2>
      <div class="sub">이번 주 기준, 모임원이 공유한 일정을 바탕으로 계산했어요.</div>
      <div class="heatmap" id="heatmap"></div>
      <div class="heat-legend">
        <span><i class="legend-dot" style="background:var(--busy-bg)"></i>바쁨</span>
        <span><i class="legend-dot" style="background:var(--mid-bg)"></i>일부 가능</span>
        <span><i class="legend-dot" style="background:var(--free-bg)"></i>모두 가능</span>
      </div>
    </section>

    <section class="card ai-card">
      <h2>추천 Top 3</h2>
      <div class="sub">전원 가능한 시간이 없으면 최다 인원이 가능한 시간을 대신 추천해요.</div>
      <div class="rec-list" id="recList"></div>
      <button class="btn btn-teal" id="btnRegisterRec" style="width:100%;justify-content:center;margin-top:16px">추천 일정 등록</button>
      <div class="ai-note">등록 전에 시간을 직접 검토하고 수정할 수도 있어요. 등록하면 모임 일정에 바로 반영돼요.</div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script th:src="@{/js/group/group-shared.js}" src="../../static/js/group/group-shared.js"></script>
<script>
const group = currentGroup();

document.getElementById('groupTitle').textContent = `AI 시간 추천 · ${group.name}`;
document.getElementById('crumbGroup').textContent = group.name;
document.getElementById('crumbGroup').href = linkToDetail(group.id);
document.getElementById('btnBack').href = linkToDetail(group.id);

document.getElementById('heatmap').innerHTML = buildHeatmapHTML(group);

const recList = document.getElementById('recList');
const registerBtn = document.getElementById('btnRegisterRec');
if(!group.recs.length){
  recList.innerHTML = '<div class="empty-note">추천할 시간이 아직 없어요. 모임원이 일정을 공유하면 여기에 추천이 나타나요.</div>';
  registerBtn.disabled = true;
} else {
  group.recs.forEach(r => {
    const el = document.createElement('div');
    el.className = 'rec' + (r.rank === 1 ? ' best' : '');
    el.innerHTML = `
      <div class="rec-rank">${r.rank}순위</div>
      <b>${r.label}</b>
      <span>${r.sub}</span>
      <em>${r.tag}</em>`;
    recList.appendChild(el);
  });
}

registerBtn.addEventListener('click', ()=>{
  showToast('추천 일정을 모임 일정에 등록했어요.');
});
</script>
</body>
</html>
