<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanSlot - 내 모임</title>
<link rel="stylesheet" th:href="@{/css/group/group-shared.css}">
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<div class="app">
  <div class="page-head">
    <div>
      <div class="brand"><b>PlanSlot</b> · 모임 캘린더</div>
      <h1>내 모임</h1>
      <p>참여중인 모임을 확인하고, 초대받은 모임에 응답해보세요.</p>
    </div>
    <div class="head-actions">
      <button class="btn btn-teal" id="btnNewGroup">+ 새 모임 만들기</button>
    </div>
  </div>

  <div class="toolbar">
    <input class="search-box" id="groupSearch" placeholder="모임 이름 검색">
    <div class="filter-chips">
      <button class="chip active" data-filter="all">전체</button>
      <button class="chip" data-filter="joined">참여중</button>
      <button class="chip" data-filter="waiting">초대받음</button>
    </div>
  </div>

  <div class="list-grid" id="groupGrid"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="createGroupModal" style="display:none;">
  <div class="modal-box">
    <h3>새 모임 만들기</h3>
    <p>새로운 모임을 만들고 인원을 초대해보세요.</p>
    <div style="margin: 16px 0;">
      <input id="newGroupName" placeholder="모임 이름 (1~30자)" maxlength="30" style="width: 100%; padding: 8px;">
    </div>
    <div class="modal-actions" style="display: flex; gap: 8px;">
      <button class="btn btn-ghost" id="createCancel">취소</button>
      <button class="btn btn-primary" id="createConfirm">생성하기</button>
    </div>
  </div>
</div>

<script th:src="@{/js/group/group-shared.js}" src="../../static/js/group/group-shared.js"></script>
<script>
function renderGrid(){
  const wrap = document.getElementById('groupGrid');
  const activeFilter = document.querySelector('.chip.active').dataset.filter;
  const q = document.getElementById('groupSearch').value.trim().toLowerCase();

  wrap.innerHTML = '';
  const filtered = GROUPS
    .filter(g => activeFilter === 'all' ? true : g.filter === activeFilter)
    .filter(g => g.name.toLowerCase().includes(q));

  if(!filtered.length){
    wrap.innerHTML = '<div class="empty-note">조건에 맞는 모임이 없어요.</div>';
    return;
  }

  filtered.forEach(g => {
    const isWaiting = g.filter === 'waiting';
    const badge = isWaiting
      ? '<span class="pill waiting">초대 대기중</span>'
      : (isOwner(g) ? '<span class="pill owner">내가 방장</span>' : '');
    const card = document.createElement('a');
    card.className = 'group-card';
    card.href = linkToDetail(g.id);
    card.innerHTML = `
      <div class="top-row">
        <div class="group-avatar">${initials(g.name)}</div>
        <div>
          <b>${g.name}</b>
          <div class="count">참여자 ${g.members.length}명</div>
        </div>
      </div>
      ${badge}
      <div class="go">${isWaiting ? '초대 확인하기 →' : '모임 열기 →'}</div>
    `;
    wrap.appendChild(card);
  });
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderGrid();
  });
});
document.getElementById('groupSearch').addEventListener('input', renderGrid);

document.getElementById('btnNewGroup').addEventListener('click', ()=>{
  document.getElementById('newGroupName').value = '';
  document.getElementById('createGroupModal').style.display = 'flex';
});

document.getElementById('createCancel').addEventListener('click', ()=>{
  document.getElementById('createGroupModal').style.display = 'none';
});

document.getElementById('createConfirm').addEventListener('click', ()=>{
  const input = document.getElementById('newGroupName');
  const name = input.value.trim();
  if(!name){ showToast('모임 이름을 입력해주세요.'); return; }
  if(name.length > 30){ showToast('모임 이름은 30자 이하로 입력해주세요.'); return; }

  fetchApi('/group/register', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ groupName: name })
  })
    .then(res => {
      if(!res.ok) throw new Error('서버 에러가 발생했습니다.');
      return res.json();
    })
    .then(data => {
      document.getElementById('createGroupModal').style.display = 'none';
      showToast('새 모임을 만들었어요. 잠시 후 상세 페이지로 이동합니다.');
      setTimeout(()=>{
        window.location.href = linkToDetail(data.groupId);
      }, 1000);
    })
    .catch(err => {
      showToast('모임 생성에 실패했습니다. (콘솔 확인)');
      console.error(err);
    });
});

document.getElementById('newGroupName').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') {
    document.getElementById('createConfirm').click();
  }
});

async function fetchAndRenderGrid() {
  try {
    const res = await fetchApi('/group/mygroup');
    if (res.ok) {
      const data = await res.json();
      GROUPS = data.map(d => ({
        id: d.id,
        name: d.name,
        ownerId: d.ownerId,
        filter: d.filter,
        members: new Array(d.memberCount).fill({}),
        waiting: [],
        mySchedules: [],
        heat: [],
        recs: []
      }));
      renderGrid();
    } else {
      showToast('모임 목록을 불러오지 못했습니다.');
    }
  } catch (e) {
    console.error(e);
  }
}
fetchAndRenderGrid();
</script>
</body>
</html>
