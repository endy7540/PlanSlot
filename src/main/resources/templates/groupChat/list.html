<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanSlot - 모임 채팅방 목록</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Pretendard/1.3.9/static/pretendard.css">
<style>
  :root {
    --bg: #F6FAF8;
    --panel: #FFFFFF;
    --ink: #16231F;
    --ink-soft: #5B6B66;
    --line: #E4EEEA;
    --teal: #0D9488;
    --teal-deep: #0A6F66;
    --navy: #1E3A5F;
    --sky: #38BDF8;
    --radius: 18px;
    --shadow: 0 10px 25px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Pretendard, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 24px;
  }

  .header-wrap { margin-bottom: 30px; }
  .header-wrap h1 { font-size: 28px; margin: 0 0 8px; color: var(--ink); letter-spacing: -0.5px; }
  .header-wrap p { font-size: 15px; color: var(--ink-soft); margin: 0; }

  .chat-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .chat-item {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    text-decoration: none;
    color: var(--ink);
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }

  .chat-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--sky);
  }

  .chat-avatar {
    width: 60px;
    height: 60px;
    border-radius: 20px;
    background: linear-gradient(135deg, #0D9488, #38BDF8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #fff;
    font-weight: 800;
    flex-shrink: 0;
  }

  .chat-info {
    flex: 1;
    min-width: 0;
  }

  .chat-title {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .member-count {
    font-size: 13px;
    color: var(--teal);
    background: #E0F2FE;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
  }

  .chat-preview {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-meta {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .chat-time {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
  }

  .unread-badge {
    background: #EF4444;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
    display: inline-block;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    background: var(--panel);
    border-radius: var(--radius);
    border: 1px dashed #cbd5e1;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<main>
  <div class="header-wrap">
    <h1>모임 채팅방</h1>
    <p>참여 중인 모임원들과 실시간으로 소통해 보세요.</p>
  </div>

  <div class="chat-list" th:if="${groups != null and !groups.isEmpty()}">
    <a th:href="@{/groupChat/{id}(id=${group.id})}" class="chat-item" th:each="group : ${groups}">
      <div class="chat-avatar" th:if="${group.profileImageUrl != null}">
        <img th:src="${group.profileImageUrl}" alt="프로필" style="width:100%; height:100%; border-radius:20px; object-fit:cover;">
      </div>
      <div class="chat-avatar" th:unless="${group.profileImageUrl != null}" style="background: #e2e8f0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <div class="chat-info">
        <h2 class="chat-title">
          <span th:text="${group.name}">모임 이름</span>
          <span class="member-count" th:text="${group.memberCount} + '명'">3명</span>
        </h2>
        <p class="chat-preview">여기를 눌러 채팅방에 입장하세요.</p>
      </div>
      <div class="chat-meta">
        <div class="chat-time">입장하기 →</div>
      </div>
    </a>
  </div>

  <div class="empty-state" th:if="${groups == null or groups.isEmpty()}">
    <div style="font-size: 40px; margin-bottom: 16px;">💬</div>
    <h3 style="margin: 0 0 8px; color: var(--ink);">참여 중인 모임이 없습니다.</h3>
    <p style="margin: 0; font-size: 14px;">모임을 생성하거나 초대받아 채팅방을 활성화해 보세요!</p>
  </div>
</main>

</body>
</html>
