<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanSlot - 마이페이지</title>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/member/mypage.css}">
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; height: 100vh;
            font-family: Pretendard, 'Malgun Gothic', Arial, sans-serif;
            background-color: #f8fafc; 
            color: #182B3A;
            display: flex; flex-direction: column;
        }
    </style>
</head>
<body>

    <!-- 헤더 포함 -->
    <div th:replace="~{global/header :: headerFragment}"></div>

    <div class="mypage-container">
        <div class="mypage-header">
            <h1>내 프로필</h1>
            <p>개인 정보를 확인하고 수정할 수 있습니다.</p>
        </div>

        <form id="updateForm">
            <div class="form-group">
                <label for="email">이메일 (아이디)</label>
                <input type="text" id="email" disabled>
            </div>
            
            <div class="form-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" placeholder="새로운 닉네임을 입력하세요">
            </div>
            
            <div class="form-group">
                <label for="password">새 비밀번호</label>
                <input type="password" id="password" placeholder="변경하려면 입력 (그대로 두면 유지)">
            </div>
            
            <div class="form-group">
                <label for="address">주소</label>
                <input type="text" id="address" placeholder="주소를 입력하세요 (선택사항)">
            </div>
            
            <button type="submit" class="btn-update">저장하기</button>
        </form>
    </div>

    <!-- 토스트 알림창 -->
    <div id="toastMsg" class="toast-message"></div>

    <!-- Custom JS -->
    <script th:src="@{/js/member/mypage.js}"></script>
</body>
</html>
