<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanSlot - 일정 수정</title>
    <link rel="stylesheet" th:href="@{/css/notification/notification.css}"
          href="/css/notification/notification.css">
    <style>
        *{box-sizing:border-box}
        body{
            margin:0;
            min-height:100vh;
            font-family:Pretendard,'Malgun Gothic',Arial,sans-serif;
            background:#FFFFFF;
            color:#182B3A;
        }
        button,input,select,textarea{font-family:inherit}
        button{cursor:pointer}

        .wrap{max-width:600px;margin:0 auto;padding:24px 28px 60px}

        .panel{
            background:#fff;
            border:2px solid #DCEFFC;
            border-radius:12px;
            box-shadow:7px 7px 0 rgba(8,32,51,.06);
            padding:24px;
            margin-bottom:18px;
        }
        .panel-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:18px;
            border-bottom:2px solid #F3FAFF;
            padding-bottom:12px;
        }
        .panel-head h2{margin:0;font-size:20px;color:#075985}

        .form{display:flex;flex-direction:column;gap:16px}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        label{font-size:12px;font-weight:900;color:#475569;margin-bottom:6px;display:block}
        input,select,textarea{
            width:100%;
            border:2px solid #DCEFFC;
            border-radius:10px;
            padding:11px 12px;
            background:#fff;
            font-size:14px;
            transition: border-color 0.2s;
        }
        input:focus,select:focus,textarea:focus{
            outline:none;
            border-color:#38BDF8;
        }
        textarea{min-height:80px;resize:none}
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #F3FAFF;
            border: 2px solid #DCEFFC;
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            margin-bottom: 12px;
            width: fit-content;
        }
        .checkbox-row:hover {
            background: #E0F2FE;
            border-color: #38BDF8;
        }
        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #075985;
        }
        .checkbox-row span {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: #075985;
            cursor: pointer;
        }

        .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
        .primary,.ghost{
            border-radius:10px;
            padding:12px 20px;
            font-weight:900;
            font-size:14px;
            border:2px solid transparent;
            cursor:pointer;
            transition: all 0.2s;
        }
        .primary{background:#075985;color:#fff;border:0}
        .primary:hover{background:#0369a1}
        .ghost{background:#fff;color:#182B3A;border:2px solid #DCEFFC}
        .ghost:hover{background:#F0F9FF;border-color:#38BDF8}
        .primary:disabled{background:#94A3B8;cursor:not-allowed}

        .toast{
            position:fixed;
            right:26px;
            bottom:26px;
            padding:14px 18px;
            background:#075985;
            color:#fff;
            border-radius:10px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
            opacity:0;
            transform:translateY(10px);
            pointer-events:none;
            transition:.2s;
            font-weight:800;
            font-size:13px;
            z-index:10;
        }
        .toast.show{opacity:1;transform:none}
        .toast.error{background:#B91C1C}
    </style>
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<div class="wrap">

    <!-- 로그인 상태 안내 -->
    <div class="panel" id="authNotice" style="display:none">
        <div class="panel-head">
            <h2>로그인이 필요합니다</h2>
        </div>
        <p style="color:#748898;font-size:13px;line-height:1.6;margin:0 0 12px">
            일정을 수정하려면 로그인이 필요합니다. 로그인 후 이용해주세요.
        </p>
        <div class="btn-row">
            <a class="primary" style="text-decoration:none;display:inline-block" href="/auth/login">로그인 페이지로 이동</a>
            <button class="ghost" onclick="location.reload()">토큰 다시 확인</button>
        </div>
    </div>

    <!-- 일정 수정 -->
    <div class="panel" id="scheduleFormPanel" style="display:none">
        <div class="panel-head">
            <h2>일정 수정</h2>
        </div>
        <div class="form">
            <div>
                <label>제목 *</label>
                <input id="f-title" placeholder="일정 제목 (최대 50자)">
            </div>
            <div>
                <label>설명</label>
                <textarea id="f-description" placeholder="일정 상세 설명"></textarea>
            </div>
            <div class="form-row">
                <div>
                    <label>일정 유형 *</label>
                    <select id="f-scheduleType" onchange="toggleRecurrenceRow(this.value)">
                        <option value="DAILY">당일</option>
                        <option value="WEEKLY">주간</option>
                        <option value="MONTHLY">월간</option>
                        <option value="YEARLY">연간</option>
                    </select>
                </div>
                <div>
                    <label>장소</label>
                    <input id="f-location" placeholder="예: 대학본부 2층">
                </div>
            </div>
            <div class="form-row" id="recurrenceEndDateRow" style="display: none;">
                <div>
                    <label>반복 종료일 (선택)</label>
                    <input id="f-recurrenceEndDate" type="date">
                </div>
                <div>
                </div>
            </div>
            <label class="checkbox-row">
                <input id="f-allDay" type="checkbox" onchange="toggleAllDay(this.checked)">
                <span>하루종일</span>
            </label>
            
            <div class="form-row">
                <div>
                    <label>시작 날짜 *</label>
                    <input id="f-date" type="date" required onchange="syncEndDate(this.value)">
                </div>
                <div>
                    <label>종료 날짜 *</label>
                    <input id="f-endDate" type="date" required>
                </div>
            </div>

            <div class="form-row">
                <div id="timeInputs" style="grid-column: span 2; display: flex; gap: 8px;">
                    <div style="flex: 1;">
                        <label>시작 시간 *</label>
                        <input id="f-startTime" type="time" value="09:00" required>
                    </div>
                    <div style="flex: 1;">
                        <label>종료 시간 *</label>
                        <input id="f-endTime" type="time" value="10:00" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>데드라인 날짜 (선택)</label>
                    <input id="f-deadlineDate" type="date">
                </div>
                <div>
                    <label>며칠 전 알림 (선택)</label>
                    <input id="f-notifyDaysBefore" type="number" min="0" placeholder="예: 1">
                </div>
            </div>
            <label class="checkbox-row" style="margin-top: 12px;">
                <input id="f-isPublic" type="checkbox">
                <span>공개 일정으로 등록</span>
            </label>
            <div class="btn-row">
                <button class="primary" id="submitBtn" onclick="updateSchedule()">수정 완료</button>
                <button class="ghost" onclick="history.back()">취소</button>
            </div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
    const API_BASE = window.location.origin;
    let token = '';
    let scheduleId = null;
    let originalStartDateOnly = '';
    let targetDateParam = '';

    function showToast(msg, isError) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isError ? ' error' : '');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    function checkAuth() {
        token = localStorage.getItem('jwtToken') || '';
        const notice = document.getElementById('authNotice');
        const formPanel = document.getElementById('scheduleFormPanel');

        if (token) {
            notice.style.display = 'none';
            formPanel.style.display = '';
        } else {
            notice.style.display = '';
            formPanel.style.display = 'none';
        }
        return !!token;
    }

    function authHeaders() {
        return {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'Authorization': 'Bearer ' + token
        };
    }

    function toggleAllDay(checked) {
        const timeInputs = document.getElementById('timeInputs');
        if (checked) {
            timeInputs.style.opacity = '0.4';
            timeInputs.style.pointerEvents = 'none';
            document.getElementById('f-startTime').required = false;
            document.getElementById('f-endTime').required = false;
        } else {
            timeInputs.style.opacity = '1';
            timeInputs.style.pointerEvents = 'auto';
            document.getElementById('f-startTime').required = true;
            document.getElementById('f-endTime').required = true;
        }
    }

    function toggleRecurrenceRow(type) {
        const row = document.getElementById('recurrenceEndDateRow');
        const input = document.getElementById('f-recurrenceEndDate');
        if (type !== 'DAILY') {
            row.style.display = '';
        } else {
            row.style.display = 'none';
            input.value = '';
        }
    }

    function syncEndDate(val) {
        const endDate = document.getElementById('f-endDate');
        if (val && !endDate.value) {
            endDate.value = val;
        }
    }

    function buildScheduleBody() {
        const dateVal = document.getElementById('f-date').value; // YYYY-MM-DD
        const endDateVal = document.getElementById('f-endDate').value || dateVal; // YYYY-MM-DD
        const isAllDay = document.getElementById('f-allDay').checked;
        const startTime = document.getElementById('f-startTime').value || '09:00'; // HH:mm
        const endTime = document.getElementById('f-endTime').value || '10:00'; // HH:mm
        const recurrenceEndDate = document.getElementById('f-recurrenceEndDate').value;

        let startDate = null;
        let endDate = null;

        if (dateVal) {
            if (isAllDay) {
                startDate = `${dateVal}T00:00:00`;
                endDate = `${endDateVal}T23:59:59`;
            } else {
                startDate = `${dateVal}T${startTime}:00`;
                endDate = `${endDateVal}T${endTime}:00`;
            }
        }

        const body = {
            title: document.getElementById('f-title').value.trim(),
            description: document.getElementById('f-description').value.trim() || null,
            scheduleType: document.getElementById('f-scheduleType').value,
            startDate: startDate,
            endDate: endDate,
            isPublic: document.getElementById('f-isPublic').checked,
            location: document.getElementById('f-location').value.trim() || null,
            recurrenceEndDate: recurrenceEndDate || null
        };
        const deadlineDate = document.getElementById('f-deadlineDate').value;
        const notifyDaysBefore = document.getElementById('f-notifyDaysBefore').value;
        if (deadlineDate) {
            body.deadlineDate = deadlineDate;
            body.notifyDaysBefore = notifyDaysBefore ? Number(notifyDaysBefore) : 0;
        }
        return body;
    }

    async function loadScheduleData() {
        const parts = window.location.pathname.split('/').filter(Boolean); // ['schedule', '{scheduleId}', 'edit']
        scheduleId = parts[1]; // scheduleId

        if (!scheduleId || isNaN(scheduleId)) {
            showToast('유효하지 않은 일정 ID입니다.', true);
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/schedule/${scheduleId}`, { headers: authHeaders() });
            if (!res.ok) {
                showToast('일정 조회 실패: ' + res.status, true);
                return;
            }
            const s = await res.json();

            // 최초 원본 시작 날짜 백업
            if (s.startDate) {
                originalStartDateOnly = s.startDate.slice(0, 10);
            }

            const params = new URLSearchParams(window.location.search);
            const dateParam = params.get('date');
            targetDateParam = dateParam || '';

            if (dateParam && s.startDate) {
                const timePart = s.startDate.includes('T') ? s.startDate.split('T')[1] : s.startDate.split(' ')[1] || '09:00:00';
                const origStart = new Date(s.startDate);
                
                s.startDate = `${dateParam}T${timePart}`;
                
                if (s.endDate) {
                    const origEnd = new Date(s.endDate);
                    const newStart = new Date(`${dateParam}T${timePart}`);
                    const newEnd = new Date(newStart.getTime() + (origEnd.getTime() - origStart.getTime()));
                    const pad = (n) => String(n).padStart(2, '0');
                    s.endDate = `${newEnd.getFullYear()}-${pad(newEnd.getMonth()+1)}-${pad(newEnd.getDate())}T${pad(newEnd.getHours())}:${pad(newEnd.getMinutes())}:${pad(newEnd.getSeconds())}`;
                }
            }

            const isAllDay = s.startDate && (s.startDate.includes('T00:00') || s.startDate.includes(' 00:00')) && s.endDate && (s.endDate.includes('T23:59') || s.endDate.includes(' 23:59'));
            document.getElementById('f-allDay').checked = isAllDay;

            document.getElementById('f-title').value = s.title || '';
            document.getElementById('f-description').value = s.description || '';
            document.getElementById('f-scheduleType').value = s.scheduleType || 'DAILY';
            document.getElementById('f-location').value = s.location || '';
            
            if (s.startDate) {
                document.getElementById('f-date').value = s.startDate.slice(0, 10);
                const timePart = s.startDate.includes('T') ? s.startDate.split('T')[1] : s.startDate.split(' ')[1] || '09:00:00';
                document.getElementById('f-startTime').value = timePart.slice(0, 5);
            }
            if (s.endDate) {
                document.getElementById('f-endDate').value = s.endDate.slice(0, 10);
                const timePart = s.endDate.includes('T') ? s.endDate.split('T')[1] : s.endDate.split(' ')[1] || '10:00:00';
                document.getElementById('f-endTime').value = timePart.slice(0, 5);
            } else if (s.startDate) {
                document.getElementById('f-endDate').value = s.startDate.slice(0, 10);
            }

            toggleAllDay(isAllDay);

            document.getElementById('f-deadlineDate').value = s.deadlineDate || '';
            document.getElementById('f-notifyDaysBefore').value = s.notifyDaysBefore || '';
            const isPub = (s.isPublic === true || s.isPublic === 'Y' || s.public === true || s.public === 'Y');
            document.getElementById('f-isPublic').checked = isPub;
            
            document.getElementById('f-recurrenceEndDate').value = s.recurrenceEndDate || '';
            toggleRecurrenceRow(s.scheduleType || 'DAILY');
        } catch (e) {
            console.error(e);
            showToast('일정 데이터를 가져오는 데 실패했습니다.', true);
        }
    }

    async function updateSchedule() {
        if (!token) {
            showToast('먼저 로그인해주세요.', true);
            return;
        }
        
        const dateVal = document.getElementById('f-date').value;
        const endDateVal = document.getElementById('f-endDate').value || dateVal;
        const isAllDay = document.getElementById('f-allDay').checked;
        const startTime = document.getElementById('f-startTime').value;
        const endTime = document.getElementById('f-endTime').value;

        if (!dateVal) {
            showToast('일정 날짜는 필수입니다.', true);
            return;
        }

        if (!isAllDay && startTime && endTime) {
            if (endTime < startTime && dateVal === endDateVal) {
                showToast('종료 시간은 시작 시간보다 과거일 수 없습니다.', true);
                return;
            }
        }

        const origRes = await fetch(`${API_BASE}/schedule/${scheduleId}`, { headers: authHeaders() });
        if (!origRes.ok) {
            showToast('기존 일정 정보 조회 실패', true);
            return;
        }
        const origSchedule = await origRes.json();
        const originalType = origSchedule.scheduleType;
        const isOrigRecurrent = (originalType && originalType !== 'DAILY');

        const isMiddleInstance = originalStartDateOnly && targetDateParam && (originalStartDateOnly < targetDateParam);
        const body = buildScheduleBody();

        // 종료일 세팅
        if (endDateVal && endDateVal !== dateVal) {
            if (isAllDay) {
                body.endDate = `${endDateVal}T23:59:59`;
            } else {
                body.endDate = `${endDateVal}T${endTime || '10:00'}:00`;
            }
        }

        const scheduleType = document.getElementById('f-scheduleType').value;

        try {
            if (isMiddleInstance && isOrigRecurrent) {
                const targetDate = new Date(targetDateParam);
                const padLocal = (n) => String(n).padStart(2, '0');

                if (scheduleType === 'DAILY') {
                    let prevEndDateStr = '';
                    const prevEndDate = new Date(targetDateParam);
                    if (originalType === 'WEEKLY') {
                        prevEndDate.setDate(prevEndDate.getDate() - 7);
                    } else if (originalType === 'MONTHLY') {
                        prevEndDate.setMonth(prevEndDate.getMonth() - 1);
                    } else if (originalType === 'YEARLY') {
                        prevEndDate.setFullYear(prevEndDate.getFullYear() - 1);
                    }
                    prevEndDateStr = `${prevEndDate.getFullYear()}-${padLocal(prevEndDate.getMonth()+1)}-${padLocal(prevEndDate.getDate())}`;

                    const updateOrigBody = {
                        title: origSchedule.title,
                        description: origSchedule.description,
                        scheduleType: origSchedule.scheduleType,
                        startDate: origSchedule.startDate,
                        endDate: origSchedule.endDate,
                        isPublic: origSchedule.isPublic,
                        location: origSchedule.location,
                        recurrenceEndDate: prevEndDateStr
                    };
                    if (origSchedule.deadlineDate) {
                        updateOrigBody.deadlineDate = origSchedule.deadlineDate;
                        updateOrigBody.notifyDaysBefore = origSchedule.notifyDaysBefore || 0;
                    }

                    const putRes = await fetch(`${API_BASE}/schedule/${scheduleId}`, {
                        method: 'PUT',
                        headers: authHeaders(),
                        body: JSON.stringify(updateOrigBody)
                    });
                    if (!putRes.ok) {
                        showToast('기존 일정 기간 축소 실패: ' + putRes.status, true);
                        return;
                    }

                    const newDailyBody = {
                        title: body.title,
                        description: body.description,
                        scheduleType: 'DAILY',
                        startDate: body.startDate,
                        endDate: body.endDate,
                        isPublic: body.isPublic,
                        location: body.location,
                        recurrenceEndDate: null
                    };
                    if (body.deadlineDate) {
                        newDailyBody.deadlineDate = body.deadlineDate;
                        newDailyBody.notifyDaysBefore = body.notifyDaysBefore || 0;
                    }

                    const postDailyRes = await fetch(`${API_BASE}/schedule`, {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify(newDailyBody)
                    });
                    if (!postDailyRes.ok) {
                        showToast('단일 일정 생성 실패', true);
                        return;
                    }

                    const nextStartDate = new Date(targetDateParam);
                    if (originalType === 'WEEKLY') {
                        nextStartDate.setDate(nextStartDate.getDate() + 7);
                    } else if (originalType === 'MONTHLY') {
                        nextStartDate.setMonth(nextStartDate.getMonth() + 1);
                    } else if (originalType === 'YEARLY') {
                        nextStartDate.setFullYear(nextStartDate.getFullYear() + 1);
                    }
                    const nextStartDateStr = `${nextStartDate.getFullYear()}-${padLocal(nextStartDate.getMonth()+1)}-${padLocal(nextStartDate.getDate())}`;

                    let hasFuture = true;
                    if (origSchedule.recurrenceEndDate) {
                        const limitDate = new Date(origSchedule.recurrenceEndDate);
                        if (nextStartDate > limitDate) {
                            hasFuture = false;
                        }
                    }

                    if (hasFuture) {
                        const nextStartStrWithTime = `${nextStartDateStr}T${origSchedule.startDate.slice(11, 19)}`;
                        let nextEndStrWithTime = null;
                        if (origSchedule.endDate && origSchedule.startDate) {
                            const origStart = new Date(origSchedule.startDate);
                            const origEnd = new Date(origSchedule.endDate);
                            const diffMs = origEnd - origStart;
                            const nextEnd = new Date(nextStartDate.getTime() + diffMs);
                            nextEndStrWithTime = `${nextEnd.getFullYear()}-${padLocal(nextEnd.getMonth()+1)}-${padLocal(nextEnd.getDate())}T${padLocal(nextEnd.getHours())}:${padLocal(nextEnd.getMinutes())}:${padLocal(nextEnd.getSeconds())}`;
                        }

                        const nextScheduleBody = {
                            title: origSchedule.title,
                            description: origSchedule.description,
                            scheduleType: origSchedule.scheduleType,
                            startDate: nextStartStrWithTime,
                            endDate: nextEndStrWithTime,
                            isPublic: origSchedule.isPublic,
                            location: origSchedule.location,
                            recurrenceEndDate: origSchedule.recurrenceEndDate || null
                        };
                        if (origSchedule.deadlineDate) {
                            nextScheduleBody.deadlineDate = origSchedule.deadlineDate;
                            nextScheduleBody.notifyDaysBefore = origSchedule.notifyDaysBefore || 0;
                        }

                        const postNextRes = await fetch(`${API_BASE}/schedule`, {
                            method: 'POST',
                            headers: authHeaders(),
                            body: JSON.stringify(nextScheduleBody)
                        });
                        if (!postNextRes.ok) {
                            showToast('이후 반복 일정 분리 생성 실패', true);
                            return;
                        }
                    }

                    showToast('선택한 하루 일정이 분리되어 당일 일정으로 등록되었습니다.');
                    const dateKey = newDailyBody.startDate.slice(0, 10);
                    setTimeout(() => {
                        window.location.href = `/schedule?date=${dateKey}`;
                    }, 800);
                    return;
                }
                else {
                    const dayBeforeStr = `${targetDate.getFullYear()}-${padLocal(targetDate.getMonth()+1)}-${padLocal(targetDate.getDate() - 1)}`;

                    const updateOrigBody = {
                        title: origSchedule.title,
                        description: origSchedule.description,
                        scheduleType: origSchedule.scheduleType,
                        startDate: origSchedule.startDate,
                        endDate: origSchedule.endDate,
                        isPublic: origSchedule.isPublic,
                        location: origSchedule.location,
                        recurrenceEndDate: dayBeforeStr
                    };
                    if (origSchedule.deadlineDate) {
                        updateOrigBody.deadlineDate = origSchedule.deadlineDate;
                        updateOrigBody.notifyDaysBefore = origSchedule.notifyDaysBefore || 0;
                    }

                    const putRes = await fetch(`${API_BASE}/schedule/${scheduleId}`, {
                        method: 'PUT',
                        headers: authHeaders(),
                        body: JSON.stringify(updateOrigBody)
                    });
                    if (!putRes.ok) {
                        showToast('기존 일정 기간 축소 실패: ' + putRes.status, true);
                        return;
                    }

                    const newScheduleBody = {
                        title: body.title,
                        description: body.description,
                        scheduleType: body.scheduleType,
                        startDate: body.startDate,
                        endDate: body.endDate,
                        isPublic: body.isPublic,
                        location: body.location,
                        recurrenceEndDate: origSchedule.recurrenceEndDate || null
                    };
                    if (body.deadlineDate) {
                        newScheduleBody.deadlineDate = body.deadlineDate;
                        newScheduleBody.notifyDaysBefore = body.notifyDaysBefore || 0;
                    }

                    const postRes = await fetch(`${API_BASE}/schedule`, {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify(newScheduleBody)
                    });
                    if (!postRes.ok) {
                        showToast('새로운 일정 등록 실패: ' + postRes.status, true);
                        return;
                    }

                    showToast('이 일정 및 향후 일정이 수정되었습니다. 캘린더로 이동합니다...');
                    const dateKey = newScheduleBody.startDate.slice(0, 10);
                    setTimeout(() => {
                        window.location.href = `/schedule?date=${dateKey}`;
                    }, 800);
                    return;
                }
            }

            // 일반적인 수정의 경우 PUT 전송
            const url = `${API_BASE}/schedule/${scheduleId}`;
            const res = await fetch(url, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                showToast('수정 실패: ' + res.status, true);
                return;
            }
            showToast('일정이 수정되었습니다. 캘린더로 이동합니다...');
            const dateKey = body.startDate.slice(0, 10);
            setTimeout(() => {
                window.location.href = `/schedule?date=${dateKey}`;
            }, 800);

        } catch (e) {
            console.error(e);
            showToast('수정 중 오류 발생', true);
        }
    }

    function updateDeadlineMax() {
        const dateVal = document.getElementById('f-date').value;
        if (dateVal) {
            document.getElementById('f-deadlineDate').min = '';
            document.getElementById('f-deadlineDate').max = dateVal;
        }
    }

    document.getElementById('f-date').addEventListener('change', updateDeadlineMax);

    if (checkAuth()) {
        loadScheduleData().then(() => {
            updateDeadlineMax();
        });
    }
</script>
</body>
</html>
