<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanSlot - 일정 등록/수정</title>
    <style>
        *{box-sizing:border-box}
        body{
            margin:0;
            min-height:100vh;
            font-family:Pretendard,'Malgun Gothic',Arial,sans-serif;
            background:#FFFFFF;
            color:#182B3A;
        }
        button,input,select,textarea{font-family:inherit}
        button{cursor:pointer}

        .wrap{max-width:1100px;margin:0 auto;padding:24px 28px 60px}

        .panel{
            background:#fff;
            border:2px solid #DCEFFC;
            border-radius:12px;
            box-shadow:7px 7px 0 rgba(8,32,51,.06);
            padding:18px;
            margin-bottom:18px;
        }
        .panel-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:14px;
        }
        .panel-head h2{margin:0;font-size:18px}
        .panel-head small{color:#748898;font-weight:700}

        .token-row{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
        }

        .form{display:flex;flex-direction:column;gap:12px}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        label{font-size:12px;font-weight:900;color:#475569;margin-bottom:4px;display:block}
        input,select,textarea{
            width:100%;
            border:2px solid #DCEFFC;
            border-radius:10px;
            padding:11px 12px;
            background:#fff;
            font-size:14px;
        }
        textarea{min-height:70px;resize:vertical}
        .checkbox-row{display:flex;align-items:center;gap:8px}
        .checkbox-row input{width:auto}

        .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
        .primary,.ghost,.danger{
            border-radius:10px;
            padding:11px 16px;
            font-weight:900;
            font-size:13px;
            border:2px solid transparent;
        }
        .primary{background:#075985;color:#fff;border:0}
        .ghost{background:#fff;color:#182B3A;border:2px solid #DCEFFC}
        .danger{background:#fff;color:#B91C1C;border:2px solid #FECACA}
        .primary:disabled{background:#94A3B8;cursor:not-allowed}

        .list{display:flex;flex-direction:column;gap:10px}
        .item{
            padding:14px;
            border:2px solid #DCEFFC;
            border-radius:12px;
            background:#F8FBFF;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
        }
        .item b{display:block;margin-bottom:4px;font-size:15px}
        .item span{color:#64748b;font-size:12px;line-height:1.5}
        .item .tag{
            display:inline-block;
            background:#E0F2FE;
            color:#075985;
            border-radius:999px;
            padding:3px 8px;
            font-size:11px;
            font-weight:900;
            margin-right:6px;
        }
        .item .actions{display:flex;gap:6px}
        .item .actions button{padding:7px 12px;font-size:12px}

        .empty{color:#94A3B8;font-size:13px;padding:20px;text-align:center}

        .log{
            background:#0B1B2B;
            color:#9CDCF0;
            border-radius:10px;
            padding:14px;
            font-family:'Consolas',monospace;
            font-size:12px;
            white-space:pre-wrap;
            max-height:220px;
            overflow:auto;
        }

        .toast{
            position:fixed;
            right:26px;
            bottom:26px;
            padding:14px 18px;
            background:#075985;
            color:#fff;
            border-radius:10px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
            opacity:0;
            transform:translateY(10px);
            pointer-events:none;
            transition:.2s;
            font-weight:800;
            font-size:13px;
            z-index:10;
        }
        .toast.show{opacity:1;transform:none}
        .toast.error{background:#B91C1C}
    </style>
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<div class="wrap">

    <!-- 로그인 상태 안내 (로그인은 실제 로그인 페이지에서 진행) -->
    <div class="panel" id="authNotice" style="display:none">
        <div class="panel-head">
            <h2>로그인이 필요합니다</h2>
            <small>이 페이지는 로그인을 진행하지 않습니다</small>
        </div>
        <p style="color:#748898;font-size:13px;line-height:1.6;margin:0 0 12px">
            이 페이지는 이미 로그인된 계정의 토큰을 그대로 사용하는 API 테스트 페이지입니다.<br>
            먼저 로그인 페이지(<code>/auth</code>)에서 로그인한 뒤 다시 이 페이지로 돌아와주세요.
        </p>
        <div class="btn-row">
            <a class="primary" style="text-decoration:none;display:inline-block" href="/auth/login">로그인 페이지로 이동</a>
            <button class="ghost" onclick="location.reload()">토큰 다시 확인</button>
        </div>
    </div>

    <!-- 일정 등록 -->
    <div class="panel" id="scheduleFormPanel">
        <div class="panel-head">
            <h2 id="formTitle">1. 일정 등록</h2>
            <small id="formModeLabel">POST /schedule</small>
        </div>
        <div class="form">
            <div>
                <label>제목 *</label>
                <input id="f-title" placeholder="일정 제목 (최대 50자)">
            </div>
            <div>
                <label>설명</label>
                <textarea id="f-description" placeholder="일정 상세 설명"></textarea>
            </div>
            <div class="form-row">
                <div>
                    <label>일정 유형 *</label>
                    <select id="f-scheduleType">
                        <option value="DAILY">당일</option>
                        <option value="WEEKLY">주간</option>
                        <option value="MONTHLY">월간</option>
                        <option value="YEARLY">연간</option>
                    </select>
                </div>
                <div>
                    <label>장소</label>
                    <input id="f-location" placeholder="예: 대학본부 2층">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>시작 일시 *</label>
                    <input id="f-startDate" type="datetime-local">
                </div>
                <div>
                    <label>종료 일시</label>
                    <input id="f-endDate" type="datetime-local">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>데드라인 날짜 (선택)</label>
                    <input id="f-deadlineDate" type="date">
                </div>
                <div>
                    <label>며칠 전 알림 (선택)</label>
                    <input id="f-notifyDaysBefore" type="number" min="0" placeholder="예: 1">
                </div>
            </div>
            <div class="checkbox-row">
                <input id="f-isPublic" type="checkbox">
                <label style="margin:0">공개 일정으로 등록</label>
            </div>
            <div class="btn-row">
                <button class="primary" id="submitBtn" onclick="submitSchedule()">등록</button>
                <button class="ghost" onclick="resetForm()">취소 / 새로 작성</button>
            </div>
        </div>
    </div>

    <!-- 일정 목록 -->
    <div class="panel" id="scheduleListPanel">
        <div class="panel-head">
            <h2>2. 내 일정 목록</h2>
            <small>GET /schedule</small>
        </div>
        <div class="btn-row" style="margin-bottom:12px">
            <button class="ghost" onclick="loadSchedules()">목록 새로고침</button>
        </div>
        <div id="scheduleList" class="list">
            <div class="empty">로그인 후 목록을 불러와보세요.</div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
    const API_BASE = window.location.origin;
    let token = '';
    let editingId = null;
    function log(label, data) {
        const text = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        console.log(`[${label}]`, text);
    }


    function showToast(msg, isError) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isError ? ' error' : '');
        setTimeout(() => t.classList.remove('show'), 2200);
    }
    function checkAuth() {
        token = localStorage.getItem('jwtToken') || '';
        const badge = document.getElementById('tokenBadge');
        const notice = document.getElementById('authNotice');
        const formPanel = document.getElementById('scheduleFormPanel');
        const listPanel = document.getElementById('scheduleListPanel');

        if (token) {
            if (badge) {
                badge.textContent = '로그인됨 (토큰 보유)';
                badge.classList.remove('off');
            }
            notice.style.display = 'none';
            formPanel.style.display = '';
            listPanel.style.display = '';
        } else {
            if (badge) {
                badge.textContent = '로그인 필요';
                badge.classList.add('off');
            }
            notice.style.display = '';
            formPanel.style.display = 'none';
            listPanel.style.display = 'none';
        }
        return !!token;
    }

    function authHeaders() {
        return {
            'Content-Type': 'application/json',
            'Accept': 'application/json', // 화면(GET /schedule/{id}, text/html)과 API(JSON)가 같은 주소를 쓰므로 명시 필수
            'Authorization': 'Bearer ' + token // auth.html이 저장할 때 Bearer를 떼어내므로 여기서 다시 붙임
        };
    }

    function buildScheduleBody() {
        const body = {
            title: document.getElementById('f-title').value.trim(),
            description: document.getElementById('f-description').value.trim() || null,
            scheduleType: document.getElementById('f-scheduleType').value,
            startDate: document.getElementById('f-startDate').value ? document.getElementById('f-startDate').value + ':00' : null,
            endDate: document.getElementById('f-endDate').value ? document.getElementById('f-endDate').value + ':00' : null,
            isPublic: document.getElementById('f-isPublic').checked,
            location: document.getElementById('f-location').value.trim() || null
        };
        const deadlineDate = document.getElementById('f-deadlineDate').value;
        const notifyDaysBefore = document.getElementById('f-notifyDaysBefore').value;
        if (deadlineDate) {
            body.deadlineDate = deadlineDate;
            body.notifyDaysBefore = notifyDaysBefore ? Number(notifyDaysBefore) : 0;
        }
        return body;
    }

    async function submitSchedule() {
        if (!token) {
            showToast('먼저 로그인해주세요.', true);
            return;
        }
        const body = buildScheduleBody();
        if (!body.title || !body.startDate) {
            showToast('제목과 시작 일시는 필수입니다.', true);
            return;
        }

        const isEdit = editingId !== null;
        const url = isEdit ? `${API_BASE}/schedule/${editingId}` : `${API_BASE}/schedule`;
        const method = isEdit ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method,
                headers: authHeaders(),
                body: JSON.stringify(body)
            });
            const text = await res.text();
            log(`${method} ${url}`, `status: ${res.status}\n${text}`);
            if (!res.ok) {
                showToast('요청 실패: ' + res.status, true);
                return;
            }
            showToast(isEdit ? '일정이 수정되었습니다. 캘린더로 이동합니다...' : '일정이 등록되었습니다. 캘린더로 이동합니다...');
            const dateKey = body.startDate.slice(0, 10); // YYYY-MM-DD
            setTimeout(() => {
                window.location.href = `/schedule?date=${dateKey}`;
            }, 700);
        } catch (e) {
            log(`${method} ${url} (에러)`, e.message);
            showToast('요청 중 오류가 발생했습니다.', true);
        }
    }

    function resetForm() {
        editingId = null;
        document.getElementById('formTitle').textContent = '1. 일정 등록';
        document.getElementById('formModeLabel').textContent = 'POST /schedule';
        document.getElementById('submitBtn').textContent = '등록';
        document.getElementById('f-title').value = '';
        document.getElementById('f-description').value = '';
        document.getElementById('f-scheduleType').value = 'DAILY';
        document.getElementById('f-location').value = '';
        document.getElementById('f-startDate').value = '';
        document.getElementById('f-endDate').value = '';
        document.getElementById('f-deadlineDate').value = '';
        document.getElementById('f-notifyDaysBefore').value = '';
        document.getElementById('f-isPublic').checked = false;
    }

    function editSchedule(schedule) {
        editingId = schedule.scheduleId;
        document.getElementById('formTitle').textContent = '1. 일정 수정';
        document.getElementById('formModeLabel').textContent = `PUT /schedule/${editingId}`;
        document.getElementById('submitBtn').textContent = '수정 완료';
        document.getElementById('f-title').value = schedule.title || '';
        document.getElementById('f-description').value = schedule.description || '';
        document.getElementById('f-scheduleType').value = schedule.scheduleType || 'DAILY';
        document.getElementById('f-location').value = schedule.location || '';
        document.getElementById('f-startDate').value = schedule.startDate ? schedule.startDate.slice(0,16) : '';
        document.getElementById('f-endDate').value = schedule.endDate ? schedule.endDate.slice(0,16) : '';
        document.getElementById('f-isPublic').checked = !!schedule.isPublic;
        window.scrollTo({top:0, behavior:'smooth'});
    }

    async function deleteSchedule(id) {
        if (!confirm('이 일정을 삭제할까요?')) return;
        try {
            const res = await fetch(`${API_BASE}/schedule/${id}`, {
                method: 'DELETE',
                headers: authHeaders()
            });
            log(`DELETE /schedule/${id}`, `status: ${res.status}`);
            if (!res.ok) {
                showToast('삭제 실패: ' + res.status, true);
                return;
            }
            showToast('일정이 삭제되었습니다.');
            loadSchedules();
        } catch (e) {
            log(`DELETE /schedule/${id} (에러)`, e.message);
            showToast('삭제 중 오류가 발생했습니다.', true);
        }
    }

    async function loadSchedules() {
        if (!token) {
            showToast('먼저 로그인해주세요.', true);
            return;
        }
        const listEl = document.getElementById('scheduleList');
        try {
            const res = await fetch(`${API_BASE}/schedule`, { headers: authHeaders() });
            const text = await res.text();
            log('GET /schedule', `status: ${res.status}\n${text}`);
            if (!res.ok) {
                listEl.innerHTML = `<div class="empty">목록 조회 실패 (${res.status})</div>`;
                return;
            }
            const schedules = JSON.parse(text);
            if (!schedules.length) {
                listEl.innerHTML = '<div class="empty">등록된 일정이 없습니다.</div>';
                return;
            }
            listEl.innerHTML = schedules.map(s => `
      <div class="item">
        <div>
          <b>${escapeHtml(s.title)}</b>
          <span>
            <span class="tag">${s.scheduleType}</span>
            <span class="tag">${s.isPublic ? '공개' : '비공개'}</span>
            ${s.location ? '📍 ' + escapeHtml(s.location) : ''}
          </span><br>
          <span>${formatDate(s.startDate)} ~ ${s.endDate ? formatDate(s.endDate) : '-'}</span>
        </div>
        <div class="actions">
          <button class="ghost" onclick='editSchedule(${JSON.stringify(s)})'>수정</button>
          <button class="danger" onclick="deleteSchedule(${s.scheduleId})">삭제</button>
        </div>
      </div>
    `).join('');
        } catch (e) {
            log('GET /schedule (에러)', e.message);
            listEl.innerHTML = '<div class="empty">서버에 연결할 수 없습니다.</div>';
        }
    }

    function formatDate(iso) {
        if (!iso) return '-';
        return iso.replace('T', ' ').slice(0, 16);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // 실제 라우트가 그대로 /schedule/new, /schedule/{scheduleId} 이고
    // REST API와는 produces(Accept 헤더)로 구분되므로 겉모습을 바꿔치기할 필요가 없습니다.
    async function applyUrlParams() {
        const parts = window.location.pathname.split('/').filter(Boolean); // ['schedule','new'] or ['schedule','123']
        const last = parts[parts.length - 1];
        const dateParam = new URLSearchParams(window.location.search).get('date');

        if (last === 'new') {
            if (dateParam) {
                document.getElementById('f-startDate').value = `${dateParam}T09:00`;
            }
            return;
        }
        const scheduleId = last;

        try {
            const res = await fetch(`${API_BASE}/schedule/${scheduleId}`, { headers: authHeaders() });
            const text = await res.text();
            log(`GET /schedule/${scheduleId}`, `status: ${res.status}\n${text}`);
            if (!res.ok) {
                showToast('일정을 불러오지 못했습니다: ' + res.status, true);
                return;
            }
            editSchedule(JSON.parse(text));
        } catch (e) {
            log(`GET /schedule/${scheduleId} (에러)`, e.message);
            showToast('일정 조회 중 오류가 발생했습니다.', true);
        }
    }
    if (checkAuth()) {
        loadSchedules();
        applyUrlParams();
    }
</script>
</body>
</html>
