<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanSlot - 일정 등록</title>
    <link rel="stylesheet" th:href="@{/css/notification/notification.css}"
          href="/css/notification/notification.css">
    <style>
        *{box-sizing:border-box}
        body{
            margin:0;
            min-height:100vh;
            font-family:Pretendard,'Malgun Gothic',Arial,sans-serif;
            background:#FFFFFF;
            color:#182B3A;
        }
        button,input,select,textarea{font-family:inherit}
        button{cursor:pointer}

        .wrap{max-width:600px;margin:0 auto;padding:24px 28px 60px}

        .panel{
            background:#fff;
            border:2px solid #DCEFFC;
            border-radius:12px;
            box-shadow:7px 7px 0 rgba(8,32,51,.06);
            padding:24px;
            margin-bottom:18px;
        }
        .panel-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:18px;
            border-bottom:2px solid #F3FAFF;
            padding-bottom:12px;
        }
        .panel-head h2{margin:0;font-size:20px;color:#075985}

        .form{display:flex;flex-direction:column;gap:16px}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        label{font-size:12px;font-weight:900;color:#475569;margin-bottom:6px;display:block}
        input,select,textarea{
            width:100%;
            border:2px solid #DCEFFC;
            border-radius:10px;
            padding:11px 12px;
            background:#fff;
            font-size:14px;
            transition: border-color 0.2s;
        }
        input:focus,select:focus,textarea:focus{
            outline:none;
            border-color:#38BDF8;
        }
        textarea{min-height:80px;resize:vertical}
        .checkbox-row{display:flex;align-items:center;gap:8px}
        .checkbox-row input{width:auto}

        .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
        .primary,.ghost{
            border-radius:10px;
            padding:12px 20px;
            font-weight:900;
            font-size:14px;
            border:2px solid transparent;
            cursor:pointer;
            transition: all 0.2s;
        }
        .primary{background:#075985;color:#fff;border:0}
        .primary:hover{background:#0369a1}
        .ghost{background:#fff;color:#182B3A;border:2px solid #DCEFFC}
        .ghost:hover{background:#F0F9FF;border-color:#38BDF8}
        .primary:disabled{background:#94A3B8;cursor:not-allowed}

        .toast{
            position:fixed;
            right:26px;
            bottom:26px;
            padding:14px 18px;
            background:#075985;
            color:#fff;
            border-radius:10px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
            opacity:0;
            transform:translateY(10px);
            pointer-events:none;
            transition:.2s;
            font-weight:800;
            font-size:13px;
            z-index:10;
        }
        .toast.show{opacity:1;transform:none}
        .toast.error{background:#B91C1C}
    </style>
</head>
<body>

<div th:replace="~{global/header :: headerFragment}"></div>

<div class="wrap">

    <!-- 로그인 상태 안내 -->
    <div class="panel" id="authNotice" style="display:none">
        <div class="panel-head">
            <h2>로그인이 필요합니다</h2>
        </div>
        <p style="color:#748898;font-size:13px;line-height:1.6;margin:0 0 12px">
            일정을 등록하려면 로그인이 필요합니다. 로그인 후 이용해주세요.
        </p>
        <div class="btn-row">
            <a class="primary" style="text-decoration:none;display:inline-block" href="/auth/login">로그인 페이지로 이동</a>
            <button class="ghost" onclick="location.reload()">토큰 다시 확인</button>
        </div>
    </div>

    <!-- 일정 등록 -->
    <div class="panel" id="scheduleFormPanel">
        <div class="panel-head">
            <h2>새 일정 등록</h2>
        </div>
        <div class="form">
            <div>
                <label>제목 *</label>
                <input id="f-title" placeholder="일정 제목 (최대 50자)">
            </div>
            <div>
                <label>설명</label>
                <textarea id="f-description" placeholder="일정 상세 설명"></textarea>
            </div>
            <div class="form-row">
                <div>
                    <label>일정 유형 *</label>
                    <select id="f-scheduleType">
                        <option value="DAILY">당일</option>
                        <option value="WEEKLY">주간</option>
                        <option value="MONTHLY">월간</option>
                        <option value="YEARLY">연간</option>
                    </select>
                </div>
                <div>
                    <label>장소</label>
                    <input id="f-location" placeholder="예: 대학본부 2층">
                </div>
            </div>
            <div class="checkbox-row" style="margin-bottom: 8px;">
                <input id="f-allDay" type="checkbox" onchange="toggleAllDay(this.checked)">
                <label style="margin:0; font-weight: 700; color: #075985;">하루종일</label>
            </div>
            <div class="form-row">
                <div>
                    <label>시작 일시 *</label>
                    <input id="f-startDate" type="datetime-local">
                </div>
                <div>
                    <label>종료 일시</label>
                    <input id="f-endDate" type="datetime-local">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>데드라인 날짜 (선택)</label>
                    <input id="f-deadlineDate" type="date">
                </div>
                <div>
                    <label>며칠 전 알림 (선택)</label>
                    <input id="f-notifyDaysBefore" type="number" min="0" placeholder="예: 1">
                </div>
            </div>
            <div class="checkbox-row">
                <input id="f-isPublic" type="checkbox">
                <label style="margin:0">공개 일정으로 등록</label>
            </div>
            <div class="btn-row">
                <button class="primary" id="submitBtn" onclick="submitSchedule()">등록</button>
                <button class="ghost" onclick="history.back()">취소</button>
            </div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
    const API_BASE = window.location.origin;
    let token = '';

    function showToast(msg, isError) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isError ? ' error' : '');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    function checkAuth() {
        token = localStorage.getItem('jwtToken') || '';
        const notice = document.getElementById('authNotice');
        const formPanel = document.getElementById('scheduleFormPanel');

        if (token) {
            notice.style.display = 'none';
            formPanel.style.display = '';
        } else {
            notice.style.display = '';
            formPanel.style.display = 'none';
        }
        return !!token;
    }

    function authHeaders() {
        return {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'Authorization': 'Bearer ' + token
        };
    }

    function toggleAllDay(isAllDay) {
        const startInput = document.getElementById('f-startDate');
        const endInput = document.getElementById('f-endDate');

        const startVal = startInput.value;
        const endVal = endInput.value;

        if (isAllDay) {
            startInput.type = 'date';
            endInput.type = 'date';
            if (startVal) startInput.value = startVal.slice(0, 10);
            if (endVal) endInput.value = endVal.slice(0, 10);
        } else {
            startInput.type = 'datetime-local';
            endInput.type = 'datetime-local';
            if (startVal && startVal.length === 10) startInput.value = startVal + 'T09:00';
            if (endVal && endVal.length === 10) endInput.value = endVal + 'T18:00';
        }
    }

    function buildScheduleBody() {
        const isAllDay = document.getElementById('f-allDay').checked;
        const startVal = document.getElementById('f-startDate').value;
        const endVal = document.getElementById('f-endDate').value;

        let startDate = null;
        let endDate = null;

        if (startVal) {
            startDate = isAllDay ? startVal + 'T00:00:00' : (startVal.length === 16 ? startVal + ':00' : startVal);
        }
        if (endVal) {
            endDate = isAllDay ? endVal + 'T23:59:59' : (endVal.length === 16 ? endVal + ':00' : endVal);
        }

        const body = {
            title: document.getElementById('f-title').value.trim(),
            description: document.getElementById('f-description').value.trim() || null,
            scheduleType: document.getElementById('f-scheduleType').value,
            startDate: startDate,
            endDate: endDate,
            isPublic: document.getElementById('f-isPublic').checked,
            location: document.getElementById('f-location').value.trim() || null
        };
        const deadlineDate = document.getElementById('f-deadlineDate').value;
        const notifyDaysBefore = document.getElementById('f-notifyDaysBefore').value;
        if (deadlineDate) {
            body.deadlineDate = deadlineDate;
            body.notifyDaysBefore = notifyDaysBefore ? Number(notifyDaysBefore) : 0;
        }
        return body;
    }

    async function submitSchedule() {
        if (!token) {
            showToast('먼저 로그인해주세요.', true);
            return;
        }
        const body = buildScheduleBody();
        if (!body.title || !body.startDate) {
            showToast('제목과 시작 일시는 필수입니다.', true);
            return;
        }

        const url = `${API_BASE}/schedule`;
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                showToast('등록 실패: ' + res.status, true);
                return;
            }
            showToast('일정이 등록되었습니다. 캘린더로 이동합니다...');
            const dateKey = body.startDate.slice(0, 10); // YYYY-MM-DD
            setTimeout(() => {
                window.location.href = `/schedule?date=${dateKey}`;
            }, 700);
        } catch (e) {
            console.error(e);
            showToast('요청 중 오류가 발생했습니다.', true);
        }
    }

    function applyUrlParams() {
        const dateParam = new URLSearchParams(window.location.search).get('date');
        if (dateParam) {
            document.getElementById('f-startDate').value = `${dateParam}T09:00`;
        }
    }

    if (checkAuth()) {
        applyUrlParams();
    }
</script>
</body>
</html>
